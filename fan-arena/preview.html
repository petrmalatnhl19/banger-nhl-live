<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BANGER FAN ARENA – náhled</title><style>
*{box-sizing:border-box}body{margin:0;background:#050d13;color:#f2f8f6;font:16px system-ui}.arena{max-width:1050px;margin:auto;padding:14px}.arena header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:950;font-style:italic;letter-spacing:.06em}.brand small{display:block;color:#a7b9bd;font-size:10px;letter-spacing:.25em}.arena select{background:#14252b;color:white;border:1px solid #657b80;border-radius:10px;padding:10px;font:inherit;max-width:100%}.hero{position:relative;isolation:isolate;overflow:hidden;margin-top:16px;min-height:290px;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;border:1px solid var(--accent);border-radius:22px;background:radial-gradient(ellipse at top right,var(--secondary),transparent 75%),#0b1b20;box-shadow:0 12px 35px #0008,inset 0 -3px var(--accent)}.hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#03110ee8,#03110e25),linear-gradient(0deg,#03110e,#03110e00 70%);pointer-events:none}.arena[data-team=DAL] .hero{background-color:#04150f;background-image:url("dallas-arena(1).webp"),url(dallas-arena.svg);background-position:65% center,center;background-size:cover;background-repeat:no-repeat}@media(max-width:600px){.arena[data-team=DAL] .hero{background-position:72% center,center}.arena[data-team=DAL] .hero:before{background:linear-gradient(90deg,#03110ec9,#03110e10),linear-gradient(0deg,#03110ef5,transparent 85%)}}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;color:#e1eee8}.hero h1{font-size:clamp(38px,8vw,76px);line-height:.94;letter-spacing:-.045em;font-weight:950;font-style:italic;margin:12px 0;overflow-wrap:anywhere}.hero p{margin:5px 0;color:#e0eee8}.modules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.panel{border:1px solid #344b4b;border-top:2px solid var(--accent);border-radius:15px;padding:16px;background:linear-gradient(145deg,#142629,#0a151b)}.panel h2{font-size:17px;margin:0 0 10px}.panel p{font-size:13px;color:#bacbd0;margin:0}.notice{font-size:12px;color:#bacbd0;margin:16px 0}.arena :focus-visible{outline:3px solid white;outline-offset:3px}@media(max-width:600px){.modules{grid-template-columns:1fr}.hero{min-height:245px;padding:18px}}@media(forced-colors:active){.hero:before{display:none}.hero{background:none!important}}
</style></head><body><main class="arena"><header><div class="brand">BANGER<small>NHL LIVE</small></div><label>Klub <select id="team"></select></label></header><section class="hero"><div class="eyebrow">FAN ARENA · MŮJ TÝM</div><h1 id="name"></h1><p id="tagline"></p></section><div class="modules"><section class="panel"><h2>Poslední zápas</h2><p>Čeká na napojení ověřených dat.</p></section><section class="panel"><h2>Další zápas</h2><p>Čeká na napojení rozpisu.</p></section><section class="panel"><h2>Forma týmu</h2><p>Čeká na napojení výsledků.</p></section></div><p class="notice">Vývojový náhled · bez živých dat · pouze Dallas má vlastní obrazový banner.</p></main><script src="themes.js"></script><script>
const select=document.getElementById('team'),arena=document.querySelector('.arena'),heading=document.getElementById('name'),tag=document.getElementById('tagline');
for(const code of BangerArenaThemes.codes){const o=document.createElement('option');o.value=code;o.textContent=code==='DAL'?'Dallas Stars':code;select.append(o)}
function render(){const t=BangerArenaThemes.get(select.value);if(!t)return;arena.dataset.team=t.code;arena.style.setProperty('--accent',t.accent);arena.style.setProperty('--secondary',t.secondary);heading.textContent=t.code==='DAL'?'DALLAS STARS':t.code;tag.textContent=t.code==='DAL'?'Victory Green · atmosféra domácí arény':'Společný týmový motiv'}
select.value='DAL';select.addEventListener('change',render);render();
</script></body></html>
