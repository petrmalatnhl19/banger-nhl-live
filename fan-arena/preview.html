<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAN Arena – vývojový náhled</title><style>
body{margin:0;background:#071320;color:#fff;font:16px system-ui}.arena{max-width:720px;margin:auto;padding:16px}.arena select{font:inherit;padding:10px;max-width:100%}.arena .hero{margin-top:16px;min-height:180px;padding:24px;border:1px solid var(--accent,#789);border-radius:20px;background:radial-gradient(ellipse at top right,var(--secondary,#234),transparent 70%),linear-gradient(130deg,#071320,#142536);box-shadow:inset 0 -3px var(--accent,#789)}.arena h1{font-size:clamp(24px,6vw,44px);overflow-wrap:anywhere}.arena p{color:#dce8f2}.arena select:focus-visible{outline:3px solid white;outline-offset:3px}
</style><main class="arena"><label for="team">Tým – vývojový náhled</label> <select id="team"></select><section class="hero"><p>BANGER NHL LIVE · FAN ARENA</p><h1 id="name"></h1><p>Grafický základ · bez živých dat</p></section></main><script src="themes.js"></script><script>
const select=document.getElementById('team'),arena=document.querySelector('.arena'),name=document.getElementById('name');
for(const code of BangerArenaThemes.codes){const o=document.createElement('option');o.value=code;o.textContent=code;select.append(o)}
function render(){const t=BangerArenaThemes.get(select.value);if(!t)return;arena.style.setProperty('--accent',t.accent);arena.style.setProperty('--secondary',t.secondary);name.textContent=t.code}
select.value='DAL';select.addEventListener('change',render);render();
</script></html>
