name: Refresh NHL projected lineups
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_rosters.py
      - name: Refresh validated lineup projections
        run: python scripts/update_lineups.py || echo 'No fresh validated lineups; retaining last published data'
      - run: python scripts/update_last_game_lines.py
      - run: python scripts/check_lineups_coverage.py
      - run: python scripts/audit_lineups.py
      - name: Fetch projected starting goalies (optional source)
        run: python scripts/update_starting_goalies.py
      - name: Commit changed lineups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in lineups.json lineups_archive.json nhl_rosters.json lineups_coverage.json starting_goalies.json lineups_changes.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update NHL projected lineups"
            git push
          fi
