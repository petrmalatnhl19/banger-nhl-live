name: Refresh NHL projected lineups
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test player name matching
        run: python -m unittest scripts/test_lineup_name_matching.py
      - name: Refresh NHL rosters
        run: python scripts/update_rosters.py
      - name: Refresh validated lineup projections
        run: python scripts/update_lineups.py
      - name: Report missing formations (non-blocking)
        continue-on-error: true
        run: |
          python scripts/check_lineups.py | tee lineup_completeness.txt
          exit ${PIPESTATUS[0]}
      - name: Publish formation completeness summary
        if: always()
        run: |
          if [ -f lineup_completeness.txt ]; then
            echo '### Formation completeness (4 forward lines, 3 defense pairs)' >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
            cat lineup_completeness.txt >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Refresh recent lineups
        run: python scripts/update_last_game_lines.py
      - name: Verify lineup coverage
        run: python scripts/check_lineups_coverage.py
      - name: Publish readable projection diagnostics
        if: always()
        run: |
          if [ -f lineups_diagnostics.md ]; then cat lineups_diagnostics.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Audit lineup data
        run: python scripts/audit_lineups.py
      - name: Fetch projected starting goalies (optional source)
        run: python scripts/update_starting_goalies.py
      - name: Probe public goalie sources (diagnostic only)
        if: always()
        run: |
          python scripts/probe_goalie_sources.py > goalie_sources_probe.json
          cat goalie_sources_probe.json
          {
            echo '### Goalie source connectivity test'
            echo '\`\`\`json'
            cat goalie_sources_probe.json
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate RotoWire goalie matchups (diagnostic only)
        if: always()
        run: |
          python scripts/parse_rotowire_goalies.py || echo "RotoWire diagnostic unavailable"
          if [ -f rotowire_goalies_diagnostic.json ]; then
            python -c 'import json; d=json.load(open("rotowire_goalies_diagnostic.json")); print("RotoWire matched:",d["matchedCount"],"of",d["candidateCount"]); print(json.dumps(d["matches"][:8],indent=2))'
          fi
      - name: Publish verified RotoWire goalie starts
        run: |
          if [ -f rotowire_goalies_diagnostic.json ]; then
            python scripts/publish_rotowire_goalies.py || echo "Keeping previous starter feed; RotoWire publication unavailable"
          fi
      - name: Build complete NHL goalie catalog
        run: python scripts/build_goalie_catalog.py
      - name: Integrate verified goalie data into lineup UI
        run: python scripts/integrate_goalies_ui.py
      - name: Commit changed lineups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in index.html lineups.json lineups_archive.json nhl_rosters.json lineups_coverage.json starting_goalies.json nhl_goalies.json rotowire_goalies.json rotowire_goalies_diagnostic.json lineups_changes.json lineups_diagnostics.md lineups_source_diagnostics.json lineups_discovery_diagnostics.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update NHL projected lineups"
            git push
          fi
