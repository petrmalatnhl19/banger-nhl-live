name: Refresh NHL projected lineups
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: nhl-lineups-main
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test player name matching
        run: python -m unittest scripts/test_lineup_name_matching.py
      - name: Refresh NHL news headlines (optional)
        continue-on-error: true
        run: python scripts/update_nhl_news.py
      - name: Refresh NHL rosters
        run: python scripts/update_rosters.py
      - name: Inspect Tampa Bay projected line source
        continue-on-error: true
        run: python scripts/inspect_tampa_source.py
      - name: Check Utah Artem Duda in official NHL game boxscores
        continue-on-error: true
        run: python scripts/check_utah_game_roster.py
      - name: Check Detroit John Leonard in official NHL game boxscores
        continue-on-error: true
        run: python scripts/check_detroit_game_roster.py
      - name: Check Dallas Trey Taylor in official NHL game boxscores
        continue-on-error: true
        run: python scripts/check_dallas_game_roster.py
      - name: Check Ottawa players in official NHL game boxscores (diagnostic only)
        continue-on-error: true
        run: python scripts/check_ottawa_game_roster.py
      - name: Refresh validated lineup projections
        run: python scripts/update_lineups.py
      - name: Report missing formations (non-blocking)
        continue-on-error: true
        run: |
          python scripts/check_lineups.py | tee lineup_completeness.txt
          exit ${PIPESTATUS[0]}
      - name: Publish formation completeness summary
        if: always()
        run: |
          if [ -f lineup_completeness.txt ]; then
            echo '### Formation completeness (4 forward lines, 3 defense pairs)' >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
            cat lineup_completeness.txt >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Probe free lineup sources (diagnostic only)
        if: always()
        run: |
          python scripts/probe_free_lineup_sources.py
          echo '### Free lineup source connectivity (not permission to reuse)' >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`json' >> "$GITHUB_STEP_SUMMARY"
          cat lineup_free_sources_probe.json >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
      - name: Audit actual lineup source usage
        if: always()
        run: python scripts/report_lineup_source_usage.py
      - name: Build Lineup Core 2.0 completeness report
        run: python scripts/lineup_core_v2.py
      - name: Explain rejected source formations
        run: python scripts/lineup_rejection_report.py
      - name: Build missing lineup recovery priorities
        run: python scripts/lineup_recovery_plan.py
      - name: Publish missing lineup recovery priorities
        run: |
          echo '### Missing lineup recovery priorities' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("lineup_recovery_plan.json")
          if p.exists():
              data = json.loads(p.read_text(encoding="utf-8"))
              print("| Team | Missing forwards | Missing defense | Cause |")
              print("|---|---:|---:|---|")
              for item in data.get("teams", []):
                  print(f"| {item['team']} | {item['missingForwardLines']} | {item['missingDefensePairs']} | {item['reason']} |")
          PY
      - name: Audit rejected player identities and ambiguous names
        run: python scripts/lineup_identity_audit.py
      - name: Refresh recent lineups
        run: python scripts/update_last_game_lines.py
      - name: Verify lineup coverage
        run: python scripts/check_lineups_coverage.py
      - name: Publish readable projection diagnostics
        if: always()
        run: |
          if [ -f lineups_diagnostics.md ]; then cat lineups_diagnostics.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Audit lineup data
        run: python scripts/audit_lineups.py
      - name: Fetch projected starting goalies (optional source)
        run: python scripts/update_starting_goalies.py
      - name: Probe public goalie sources (diagnostic only)
        if: always()
        run: |
          python scripts/probe_goalie_sources.py > goalie_sources_probe.json
          cat goalie_sources_probe.json
          {
            echo '### Goalie source connectivity test'
            echo '\`\`\`json'
            cat goalie_sources_probe.json
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test RotoWire publisher health checks
        run: python -m unittest scripts.test_rotowire_publisher_health
      - name: Validate RotoWire goalie matchups
        shell: bash
        run: |
          rm -f rotowire_goalies_diagnostic.json
          if python scripts/parse_rotowire_goalies.py; then
            echo 'CORE43_ROTOWIRE_PARSE_OK=true' >> "$GITHUB_ENV"
          else
            echo 'CORE43_ROTOWIRE_PARSE_OK=false' >> "$GITHUB_ENV"
            echo '::warning title=RotoWire parser failed::No fresh diagnostic was produced; previous goalie feed is retained.'
          fi
      - name: Publish verified RotoWire goalie starts
        shell: bash
        run: |
          if [ "$CORE43_ROTOWIRE_PARSE_OK" = true ] && python scripts/publish_rotowire_goalies.py; then
            echo 'CORE43_ROTOWIRE_PUBLISH_OK=true' >> "$GITHUB_ENV"
          else
            echo 'CORE43_ROTOWIRE_PUBLISH_OK=false' >> "$GITHUB_ENV"
            echo '::warning title=RotoWire publisher failed::Goalie feed was not refreshed; check source coverage and publisher output.'
          fi
      - name: Report goalie feed publication health
        if: always()
        run: |
          python scripts/check_rotowire_publisher_health.py
      - name: Audit CORE 4.3 starter evidence provenance
        run: python scripts/audit_core43_rotowire_evidence.py
      - name: Build complete NHL goalie catalog
        run: python scripts/build_goalie_catalog.py
      - name: Integrate verified goalie data into lineup UI
        run: python scripts/integrate_goalies_ui.py
      # Protected main requires a pull request and the frontend-smoke check.
      # This action reuses one bot branch/PR rather than opening a new PR every 15 minutes.
      - name: Require token that triggers PR checks
        env:
          LINEUPS_PR_TOKEN: ${{ secrets.LINEUPS_PR_TOKEN }}
        run: |
          if [ -z "$LINEUPS_PR_TOKEN" ]; then
            echo '::error title=Missing LINEUPS_PR_TOKEN::A repository secret with PR write permission is needed so frontend-smoke runs on bot-created PRs. GITHUB_TOKEN-created PRs do not trigger the required check.'
            exit 1
          fi
      - name: Open or update lineup refresh pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.LINEUPS_PR_TOKEN }}
          base: main
          branch: automation/refresh-nhl-lineups
          delete-branch: true
          commit-message: "Update NHL projected lineups"
          title: "Automated NHL projected lineups refresh"
          body: |
            Automated lineup and goalie data refresh.
            Changes must pass required checks before merge into protected main.
            Review generated files and source timestamps before merging.
          add-paths: |
            nhl_news.json
            lineups.json
            lineups_archive.json
            nhl_rosters.json
            lineups_coverage.json
            starting_goalies.json
            nhl_goalies.json
            rotowire_goalies.json
            rotowire_goalies_diagnostic.json
            lineups_changes.json
            lineups_source_diagnostics.json
            lineups_discovery_diagnostics.json
            lineup_free_sources_probe.json
            lineup_source_usage_report.json
            lineup_core_report.json
            lineup_rejections_report.json
            lineup_recovery_plan.json
            ottawa_game_roster_diagnostic.json
            dallas_game_roster_diagnostic.json
            utah_game_roster_diagnostic.json
            detroit_game_roster_diagnostic.json
            lineup_identity_audit.json
            tampa_source_excerpt.json
      - name: Fail if RotoWire publication was unsuccessful
        if: always()
        shell: bash
        run: |
          if [ "$CORE43_ROTOWIRE_PUBLISH_OK" != true ]; then
            echo '::error title=RotoWire feed stale::The goalie publisher failed in this run. See earlier logs and the job summary.'
            exit 1
          fi
