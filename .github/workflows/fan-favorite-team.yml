name: FAN favorite team regression
on:
  pull_request:
    paths:
      - 'favorite-team.js'
      - 'tests/favorite-team.test.cjs'
      - '.github/workflows/fan-favorite-team.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fan-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check favorite-team.js
          node --check tests/favorite-team.test.cjs
      - name: Offline preference and UI behavior
        run: node tests/favorite-team.test.cjs
