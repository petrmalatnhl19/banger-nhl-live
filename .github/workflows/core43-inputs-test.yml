name: CORE 4.3 experimental inputs tests
on:
  push:
    paths:
      - 'core43-inputs.js'
      - 'core43-gsax.js'
      - 'core43-season-gsax.js'
      - 'core43-gsax-bridge.js'
      - 'core43-moneypuck-adapter.js'
      - 'core43-starter-reports.js'
      - 'core43-starter-gate.js'
      - 'core43-archive-evidence.js'
      - 'core43-revision-gate.js'
      - 'scripts/test_core43_goalie_validation.cjs'
      - 'scripts/test_core43_archive_evidence.cjs'
      - 'scripts/test_core43_revision_gate.cjs'
      - 'scripts/write_core43_revision.cjs'
      - 'scripts/test_core43_revision_writer.cjs'
      - 'scripts/monitor_core43_revisions.cjs'
      - 'scripts/test_core43_revision_monitor.cjs'
      - 'scripts/core43_computed_revision_adapter.cjs'
      - 'scripts/test_core43_computed_revision_adapter.cjs'
      - 'scripts/test_core43_inputs.cjs'
      - 'scripts/test_core43_gsax.cjs'
      - 'scripts/test_core43_season_gsax.cjs'
      - 'scripts/test_core43_gsax_bridge.cjs'
      - 'scripts/test_core43_moneypuck.cjs'
      - 'scripts/test_core43_starter_reports.cjs'
      - '.github/workflows/core43-inputs-test.yml'
  pull_request:
    paths:
      - 'core43-*.js'
      - 'scripts/*core43*.cjs'
      - '.github/workflows/core43-inputs-test.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_core43_inputs.cjs
      - run: node scripts/test_core43_gsax.cjs
      - run: node scripts/test_core43_season_gsax.cjs
      - run: node scripts/test_core43_gsax_bridge.cjs
      - run: node scripts/test_core43_moneypuck.cjs
      - run: node scripts/test_core43_starter_reports.cjs
      - run: node scripts/test_core43_goalie_validation.cjs
      - run: node scripts/test_core43_archive_evidence.cjs
      - run: node scripts/test_core43_revision_gate.cjs
      - run: node scripts/test_core43_revision_writer.cjs
      - run: node scripts/test_core43_revision_monitor.cjs
      - run: node scripts/test_core43_computed_revision_adapter.cjs
      - run: node scripts/test_core43_gsax_sensitivity.cjs
      - run: node scripts/test_core43_paired_evaluation.cjs
      - run: node scripts/test_core43_archive_integration.cjs
      - run: node scripts/test_core43_shadow_candidate_audit.cjs
