name: Kontrola aplikace BANGER NHL LIVE

on:
  push:
    paths:
      - 'index.html'
      - 'scripts/check_app.js'
      - 'scripts/browser_smoke.js'
      - '.github/workflows/check-app.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/check_app.js'
      - 'scripts/browser_smoke.js'
      - '.github/workflows/check-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntaxe a základní kontrola
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Zkontrolovat HTML a JavaScript
        run: node scripts/check_app.js
      - name: Připravit prohlížeč
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Otestovat spuštění aplikace v Chromium
        run: node scripts/browser_smoke.js
