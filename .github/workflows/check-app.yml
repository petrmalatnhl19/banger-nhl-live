name: Kontrola aplikace BANGER NHL LIVE

on:
  push:
    paths:
      - 'index.html'
      - 'scripts/check_app.js'
      - '.github/workflows/check-app.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/check_app.js'
      - '.github/workflows/check-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntaxe a základní kontrola
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Zkontrolovat HTML a JavaScript
        run: node scripts/check_app.js
