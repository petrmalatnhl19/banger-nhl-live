name: Frontend smoke checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: UX-01 mobile Games filter regression
        run: node .github/scripts/test-ux-01-games.cjs
      - name: Test Czech commentary facts
        run: node --test scripts/test_commentary_facts.cjs
      - name: Test VOICE-08 Android commentary rules
        run: node --test .github/scripts/test-voice-08.cjs
      - name: SECURITY-274 TV error disclosure regression
        run: node .github/scripts/test-security274-tv-error.cjs
      - name: DATA-01/02 lineup and goalie integrity
        run: node --test .github/scripts/test-data-01-02.cjs
      - name: DATA-03 goalie roster and source conflicts
        run: node --test .github/scripts/test-data-03.cjs
      - name: DATA-05 source freshness checks
        run: node --test .github/scripts/test-data-05.cjs
      - name: DATA-06 UI data freshness
        run: node --test .github/scripts/test-data-06.cjs
      - name: DATA-07 source transparency
        run: node --test .github/scripts/test-data-07.cjs
      - name: DATA-08 coverage integrity and partial exports
        run: node --test .github/scripts/test-data-08.cjs
      - name: DATA-09 goalie collector status schema
        run: python -m unittest scripts/test_data_09_goalie_status.py
      - name: DATA-10 dated goalie source validation
        run: python -m unittest scripts/test_data_10_goalie_date.py
      - name: DATA-11 goalie feed audit regressions
        run: python -m unittest scripts/test_data_11_goalie_feed.py
      - name: DATA-11 inspect committed goalie export
        run: python scripts/audit_data_11_goalie_feed.py
      - name: DATA-12 goalie publisher schema regression
        run: python -m unittest scripts/test_data_12_goalie_publisher.py scripts.test_core43_rotowire_publisher_provenance
      - name: DATA-13 game identity regressions
        run: python -m unittest scripts/test_data_13_game_identity.py
      - name: DATA-13 conflicting goalie confirmation suppression
        run: python -m unittest scripts/test_goalie_conflict_suppression.py
      - name: DATA-12 source failure diagnostics
        run: python -m unittest scripts/test_data_12_source_failures.py

      - name: DATA-12 source health summary regressions
        run: python -m unittest scripts/test_data_12_source_health_report.py
      - name: VIDEO-03 official highlights metadata regression
        run: node --test tests/video-03-live-highlights.test.cjs
      - name: VIDEO-05 official highlight link UI regression
        run: node --test tests/video-05-highlights-ui.test.cjs
      - name: VIDEO-06 goal-to-clip event matching regression
        run: node --test tests/video-06-goal-video-map.test.cjs
      - name: VIDEO-07 match goal links integration regression
        run: node --test tests/video-07-match-integration.test.cjs
      - name: VIDEO-09 safe LIVE clip refresh regression
        run: node --test tests/video-09-live-refresh.test.cjs
      - name: VIDEO-10 live goal link lifecycle integration
        run: node --test tests/video-10-live-integration.test.cjs
      - name: VIDEO-24 official full-game recap links regression
        run: node --test tests/video-23-game-recaps.test.cjs
      - name: UX-VIDEO-28 Goal Center prominence regression
        run: node --test tests/ux-video-28-goal-center.test.cjs
      - name: UX-LINEUPS-01 official versus projected rosters
        run: node --test tests/ux-lineups-01.test.cjs
      - name: VIDEO-11 NHL clip metadata diagnostic (informational)
        continue-on-error: true
        run: node scripts/video-11-nhl-diagnostic.cjs

      - name: BANGER TV historical NHL proxy regression
        run: node --test tests/banger-tv-history-proxy.test.cjs

      - name: BANGER TV live CAR NYR proxy diagnostic (PR 424 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 424
        run: node scripts/diagnose-banger-tv-real-history.cjs

      - name: BANGER TV real NHL right-rail schema diagnostic (PR 425 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 425
        run: node scripts/diagnose-banger-tv-real-right-rail.cjs

      - name: Validate local scripts and HTML entrypoint
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile, sys
          from urllib.parse import urlsplit, unquote

          root = Path.cwd()
          html = (root / 'index.html').read_text(encoding='utf-8')
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sources = []
                  self.inline = []
                  self.inside = False
                  self.buffer = []
              def handle_starttag(self, tag, attrs):
                  if tag != 'script':
                      return
                  a = dict(attrs)
                  self.inside = 'src' not in a
                  self.buffer = []
                  if 'src' in a:
                      self.sources.append(a['src'])
              def handle_data(self, data):
                  if self.inside:
                      self.buffer.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.inside:
                      self.inline.append(''.join(self.buffer))
                      self.inside = False
          parser = Scripts()
          parser.feed(html)
          errors = []
          seen = set()
          for src in parser.sources:
              url = urlsplit(src)
              if url.scheme or url.netloc or src.startswith('//'):
                  continue
              path = unquote(url.path).lstrip('/')
              if not path or '..' in Path(path).parts:
                  errors.append(f'Invalid local script path: {src}')
                  continue
              if path in seen:
                  errors.append(f'Duplicate local script include: {path}')
              seen.add(path)
              target = root / path
              if not target.is_file():
                  errors.append(f'Missing local script: {path}')
                  continue
              result = subprocess.run(['node', '--check', str(target)], capture_output=True, text=True)
              if result.returncode:
                  errors.append(f'JavaScript syntax error in {path}: {result.stderr[:700]}')
          with tempfile.TemporaryDirectory() as tmp:
              for i, code in enumerate(parser.inline, 1):
                  if not code.strip():
                      continue
                  target = Path(tmp) / f'inline-{i}.js'
                  target.write_text(code, encoding='utf-8')
                  result = subprocess.run(['node', '--check', str(target)], capture_output=True, text=True)
                  if result.returncode:
                      errors.append(f'Inline script #{i}: {result.stderr[:700]}')
          # Regression guard for the malformed duplicate news function that
          # previously prevented the entire app from loading.
          if html.count('function newsArticleCard(article){') != 1:
              errors.append('News renderer must be defined exactly once')
          if "function newsArticleCard(article){');" in html:
              errors.append('Broken news renderer fragment detected')
          if 'function newsArticleTeams(' not in html:
              errors.append('News team resolver missing')
          print(f'Checked {len(parser.sources)} external script references and {len(parser.inline)} inline scripts')

          if errors:
              print('\n'.join(errors), file=sys.stderr)
              sys.exit(1)
          print('Frontend smoke checks passed')
          PY

  database-grants:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: grants_fixture
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d grants_fixture"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse minimal grant change on disposable PostgreSQL
        run: docker exec -i ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d grants_fixture < .github/scripts/test-db-grants.sql

  browser-smoke:
    needs: frontend-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium
          command -v Xvfb >/dev/null || { echo 'Xvfb is missing on runner'; exit 1; }
      - name: Start local web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/banger-server.log 2>&1 &
          echo $! > /tmp/banger-server.pid
      - name: Test STAB-05.14 LIVE monitoring with deterministic API fixture
        run: node .github/scripts/test-live-monitor.cjs
      - name: VIDEO-13 Android-sized Chromium official goal links
        run: node .github/scripts/browser-video-13-mobile.cjs
      - name: VIDEO-16 build isolated Android preview from NHL data
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'video-01-live-highlights-audit'
        run: node scripts/video-16-build-preview.cjs
      - name: VIDEO-16 upload Android preview HTML
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'video-01-live-highlights-audit'
        uses: actions/upload-artifact@v4
        with:
          name: video-16-android-preview
          path: video16-preview/index.html
          if-no-files-found: error
          retention-days: 7
      - name: VIDEO-14 real NHL landing mobile integration (informational)
        continue-on-error: true
        run: node .github/scripts/browser-video-14-real-nhl.cjs
      - name: VIDEO-15 Android navigation and return from official clip
        run: node .github/scripts/browser-video-15-navigation.cjs
      - name: VIDEO-17 actual match modal official goal links
        run: node .github/scripts/browser-video-17-real-match.cjs
      - name: BANGER TV browser historical stats rendering regression
        run: node .github/scripts/browser-banger-tv-history.cjs
      - name: Check TV panel with available, restricted and failed data sources
        run: node .github/scripts/browser-tv-grants.cjs
      - name: Test application startup in Chromium
        run: node .github/scripts/browser-smoke.cjs
      - name: Test FAN-08 favorite team picker on 360, 390 and 430 px
        run: node .github/scripts/browser-favorite-team.cjs
      - name: Test UX-03 mobile Statistics search, sorting and categories
        run: node .github/scripts/browser-mobile-statistics.cjs
      - name: Test UX-04 mobile analytics and report dialog
        run: node .github/scripts/browser-mobile-analytics.cjs
      - name: Test UX-05 request deduplication and fresh live scores
        run: node .github/scripts/browser-app-performance.cjs
      - name: Test UX-06 late standings response on mobile
        run: node .github/scripts/browser-mobile-standings-race.cjs
      - name: Test mobile tab reload and browser Back in Chromium
        run: node .github/scripts/browser-navigation-reload.cjs
      - name: Test offline mobile tab navigation and reconnect in Chromium
        run: node .github/scripts/browser-offline-navigation.cjs
      - name: Test NHL API interruption, timeout and recovery in Chromium
        run: node .github/scripts/browser-api-interruption.cjs
      - name: Test Prague midnight rollover and date navigation in Chromium
        run: node .github/scripts/browser-midnight-rollover.cjs
      - name: Test LIVE to FINAL cache expiry and refreshed statistics in Chromium
        run: node .github/scripts/browser-live-final-cache.cjs
      - name: Test concurrent NHL requests and stale match details in Chromium
        run: node .github/scripts/browser-concurrent-details.cjs
      - name: Test rapid date switching and stale score responses in Chromium
        run: node .github/scripts/browser-date-races.cjs
      - name: Test browser history, match detail cleanup and reload in Chromium
        run: node .github/scripts/browser-history-reload.cjs
      - name: Diagnose real Back Forward Cache eligibility in Chromium
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=5s 30s xvfb-run -a node .github/scripts/browser-bfcache-diagnostic.cjs
      - name: Test browser return, selected date and refreshed NHL scores in Chromium
        run: timeout --signal=TERM --kill-after=5s 45s xvfb-run -a node .github/scripts/browser-bfcache-return.cjs
