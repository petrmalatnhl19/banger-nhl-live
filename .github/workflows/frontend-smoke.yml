name: Frontend smoke checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate local scripts and HTML entrypoint
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile, sys
          from urllib.parse import urlsplit, unquote

          root = Path.cwd()
          html = (root / 'index.html').read_text(encoding='utf-8')
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.sources = []
                  self.inline = []
                  self.inside = False
                  self.buffer = []
              def handle_starttag(self, tag, attrs):
                  if tag != 'script':
                      return
                  a = dict(attrs)
                  self.inside = 'src' not in a
                  self.buffer = []
                  if 'src' in a:
                      self.sources.append(a['src'])
              def handle_data(self, data):
                  if self.inside:
                      self.buffer.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.inside:
                      self.inline.append(''.join(self.buffer))
                      self.inside = False
          parser = Scripts()
          parser.feed(html)
          errors = []
          seen = set()
          for src in parser.sources:
              url = urlsplit(src)
              if url.scheme or url.netloc or src.startswith('//'):
                  continue
              path = unquote(url.path).lstrip('/')
              if not path or '..' in Path(path).parts:
                  errors.append(f'Invalid local script path: {src}')
                  continue
              if path in seen:
                  errors.append(f'Duplicate local script include: {path}')
              seen.add(path)
              target = root / path
              if not target.is_file():
                  errors.append(f'Missing local script: {path}')
                  continue
              result = subprocess.run(['node', '--check', str(target)], capture_output=True, text=True)
              if result.returncode:
                  errors.append(f'JavaScript syntax error in {path}: {result.stderr[:700]}')
          with tempfile.TemporaryDirectory() as tmp:
              for i, code in enumerate(parser.inline, 1):
                  if not code.strip():
                      continue
                  target = Path(tmp) / f'inline-{i}.js'
                  target.write_text(code, encoding='utf-8')
                  result = subprocess.run(['node', '--check', str(target)], capture_output=True, text=True)
                  if result.returncode:
                      errors.append(f'Inline script #{i}: {result.stderr[:700]}')
          # Regression guard for the malformed duplicate news function that
          # previously prevented the entire app from loading.
          if html.count('function newsArticleCard(article){') != 1:
              errors.append('News renderer must be defined exactly once')
          if "function newsArticleCard(article){');" in html:
              errors.append('Broken news renderer fragment detected')
          if 'function newsArticleTeams(' not in html:
              errors.append('News team resolver missing')
          print(f'Checked {len(parser.sources)} external script references and {len(parser.inline)} inline scripts')

          if errors:
              print('\n'.join(errors), file=sys.stderr)
              sys.exit(1)
          print('Frontend smoke checks passed')
          PY

  browser-smoke:
    needs: frontend-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/banger-server.log 2>&1 &
          echo $! > /tmp/banger-server.pid
      - name: Test application startup in Chromium
        run: node .github/scripts/browser-smoke.cjs
      - name: Test mobile tab reload and browser Back in Chromium
        run: node .github/scripts/browser-navigation-reload.cjs
      - name: Test offline mobile tab navigation and reconnect in Chromium
        run: node .github/scripts/browser-offline-navigation.cjs
      - name: Test NHL API interruption, timeout and recovery in Chromium
        run: node .github/scripts/browser-api-interruption.cjs
      - name: Test Prague midnight rollover and date navigation in Chromium
        run: node .github/scripts/browser-midnight-rollover.cjs
      - name: Test LIVE to FINAL cache expiry and refreshed statistics in Chromium
        run: node .github/scripts/browser-live-final-cache.cjs
      - name: Test concurrent NHL requests and stale match details in Chromium
        run: node .github/scripts/browser-concurrent-details.cjs
      - name: Test rapid date switching and stale score responses in Chromium
        run: node .github/scripts/browser-date-races.cjs
