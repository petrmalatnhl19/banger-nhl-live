name: Security local PostgreSQL permissions

on:
  pull_request:
    paths:
      - 'security/local/**'
      - '.github/workflows/security-local-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-postgres-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Compose availability
        run: |
          docker --version
          docker compose version
      - name: Run isolated PostgreSQL privilege checks
        run: bash security/local/verify.sh
      - name: Verify transactional grants rollback (SECURITY-69)
        run: bash security/local/security69-transaction-rollback.sh
      - name: Verify baseline-derived privilege restoration (SECURITY-70)
        run: bash security/local/security70-baseline-restore.sh
      - name: Verify exact synthetic ACL restoration (SECURITY-72)
        run: bash security/local/security72-exact-acl-restore.sh
      - name: Verify role inheritance and grant delegation (SECURITY-73)
        run: bash security/local/security73-inheritance-delegation.sh
      - name: Verify multi-grantor ACL restoration (SECURITY-74)
        run: bash security/local/security74-multigrantor-restore.sh
      - name: Verify multi-level delegated grants (SECURITY-75)
        run: bash security/local/security75-multilevel-grants.sh
      - name: Verify independent grant paths (SECURITY-76)
        run: bash security/local/security76-multipath-grants.sh
      - name: Verify synthetic capture function privilege guard (SECURITY-81)
        run: bash security/local/security81-capture-function-privileges.sh
      - name: Rehearse scoped revocation, role isolation and capture (SECURITY-85/86/87)
        run: |
          docker compose -f security/local/compose.yaml exec -T postgres \
            psql -X -v ON_ERROR_STOP=1 -U security_local -d security09 \
            < security/local/security87-revocation.sql
      - name: Diagnose PostgreSQL initialization failure
        if: failure()
        run: docker compose -f security/local/compose.yaml logs --no-color postgres
      - name: Stop local test database
        if: always()
        run: docker compose -f security/local/compose.yaml down -v --remove-orphans
