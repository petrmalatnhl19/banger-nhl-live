name: CORE43-CAL-50 Ed25519 offline verification
on:
  pull_request:
    paths:
      - 'scripts/core43_cal50_signature_verify.py'
      - 'tests/test_core43_cal50.py'
      - '.github/workflows/core43-cal50-ed25519.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signature-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline Ed25519 verification regression tests
        run: python -m unittest discover -s tests -p 'test_core43_cal50.py' -v
