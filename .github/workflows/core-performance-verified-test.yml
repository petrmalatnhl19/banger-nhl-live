name: CORE performance verified integration
on:
  pull_request:
    paths:
      - 'core-performance.js'
      - 'scripts/core43_verified_dashboard.js'
      - 'scripts/test_core_performance_verified.cjs'
      - '.github/workflows/core-performance-verified-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_core_performance_verified.cjs
      - run: node scripts/test_core43_verified_dashboard.cjs
