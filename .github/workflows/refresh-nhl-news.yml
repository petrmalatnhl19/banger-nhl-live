name: Refresh NHL news

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-nhl-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch official NHL news
        run: python scripts/update_nhl_news.py
      - name: Commit updated news only when changed
        run: |
          if git diff --quiet -- nhl_news.json; then
            echo "No changes to NHL news"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nhl_news.json
          git commit -m "chore: refresh NHL news metadata"
          git push
