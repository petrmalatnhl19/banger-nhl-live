name: Security grants proposal (offline)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-security-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate proposed grants SQL without database access
        run: python3 .github/scripts/test-security-08-grants.py

      - name: Verify signed prediction snapshot integrity (offline)
        run: python3 .github/scripts/test-security-45-snapshot-signature.py

      - name: Test actual uncalibrated CORE 4.3 engine (offline)
        run: node scripts/test_security47_core43_real_engine.cjs

      - name: Test four-variant CORE 4.3 sensitivity pipeline (offline)
        run: node scripts/test_security48_four_variant_pipeline.cjs

      - name: Test frozen CORE 4.3 input binding (offline)
        run: node scripts/test_security49_frozen_bundle.cjs

      - name: Test signed pregame source provenance (offline)
        run: node scripts/test_security50_signed_source_provenance.cjs

      - name: Test independent source provenance chain (offline)
        run: node scripts/test_security51_independent_provenance.cjs

      - name: Test signed evidence to four predictions and archive (offline)
        run: node scripts/test_security52_evidence_chain.cjs

      - name: Test durable synthetic archive recovery (offline)
        run: python3 .github/scripts/test-security-53-archive-recovery.py

      - name: Test persisted four-variant archive replay (offline)
        run: python3 .github/scripts/test-security-54-persisted-chain.py

      - name: Test persisted signed evidence and four variants (offline)
        run: python3 .github/scripts/test-security-55-persisted-signed-chain.py

      - name: Test external synthetic trust registry (offline)
        run: node scripts/test_security56_external_trust_registry.cjs

      - name: Test persisted archive with external pinned keys (offline)
        run: node scripts/test_security57_persisted_external_trust.cjs

      - name: Test signed trust registry and rollback protection (offline)
        run: node scripts/test_security58_registry_rollback.cjs

      - name: Test persisted archive and signed registry rollback gate (offline)
        run: node scripts/test_security59_archive_registry_gate.cjs

      - name: Test independent signed registry checkpoint (offline)
        run: node scripts/test_security60_independent_checkpoint.cjs

      - name: Test automated machine witness on persisted archive (offline)
        run: node scripts/test_security61_machine_witness_archive.cjs

      - name: Test signed machine checkpoint history (offline)
        run: node scripts/test_security62_checkpoint_history.cjs

      - name: Test immutable pregame refresh prototype (offline)
        run: python3 .github/scripts/test-security-35-pregame-refresh.py
