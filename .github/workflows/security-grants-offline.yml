name: Security grants proposal (offline)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-security-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate proposed grants SQL without database access
        run: python3 .github/scripts/test-security-08-grants.py

      - name: Verify signed prediction snapshot integrity (offline)
        run: python3 .github/scripts/test-security-45-snapshot-signature.py

      - name: Test actual uncalibrated CORE 4.3 engine (offline)
        run: node scripts/test_security47_core43_real_engine.cjs

      - name: Test immutable pregame refresh prototype (offline)
        run: python3 .github/scripts/test-security-35-pregame-refresh.py
