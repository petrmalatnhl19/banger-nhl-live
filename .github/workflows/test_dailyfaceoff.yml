name: Test Daily Faceoff importer (isolated)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/experimental_dailyfaceoff.py'
      - 'scripts/test_experimental_dailyfaceoff.py'
      - '.github/workflows/test_dailyfaceoff.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile parser and tests
        run: python -m py_compile scripts/experimental_dailyfaceoff.py scripts/test_experimental_dailyfaceoff.py
      - name: Run offline lineup parser tests
        run: python -m unittest discover -s scripts -p 'test_experimental_dailyfaceoff.py' -v
