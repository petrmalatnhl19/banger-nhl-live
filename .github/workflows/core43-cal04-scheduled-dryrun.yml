name: CORE43-CAL-04 scheduled dry-run
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/core43_cal04_scheduled_dryrun.cjs'
      - 'scripts/test_core43_cal04_scheduled_dryrun.cjs'
      - 'scripts/test_core43_cal04_two_run_integration.cjs'
      - 'scripts/test_core43_cal04_failure_modes.cjs'
      - 'scripts/core43_cal03_capture_plan.cjs'
      - '.github/workflows/core43-cal04-scheduled-dryrun.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: core43-cal04-readonly
  cancel-in-progress: false
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_core43_cal03_capture_plan.cjs
      - run: node scripts/test_core43_cal04_scheduled_dryrun.cjs
      - run: node scripts/test_core43_cal04_two_run_integration.cjs
      - run: node scripts/test_core43_cal04_failure_modes.cjs
  dry-run:
    if: github.event_name != 'pull_request'
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore last diagnostic ledger (GitHub artifacts only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          prior_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/core43-cal04-scheduled-dryrun.yml/runs?branch=${GITHUB_REF_NAME}&status=success&per_page=30" --jq '[.workflow_runs[] | select(.id != env.GITHUB_RUN_ID and (.event=="schedule" or .event=="workflow_dispatch"))] | sort_by(.created_at) | last | .id // empty')
          if [[ -n "$prior_run" ]]; then
            mkdir -p /tmp/core43-cal04-restored
            gh run download "$prior_run" --repo "$GITHUB_REPOSITORY" --name core43-cal04-readonly-report --dir /tmp/core43-cal04-restored
            cp /tmp/core43-cal04-restored/core43-cal04-report.json /tmp/core43-cal04-prior.json
            node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("/tmp/core43-cal04-prior.json","utf8"));if(!r.ledger||r.ledger.schema!=="core43_cal04_keys_v1"||!Array.isArray(r.ledger.keys)||r.ledger.keys.some(x=>typeof x!=="string"))throw Error("invalid_prior_artifact_ledger");fs.writeFileSync("/tmp/core43-cal04-ledger.json",JSON.stringify(r.ledger))'
          fi
      - name: Read-only diagnostic report
        env:
          CORE43_CAL04_LEDGER_PATH: /tmp/core43-cal04-ledger.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_READONLY_KEY: ${{ secrets.CORE43_SUPABASE_READONLY_KEY }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_READONLY_KEY" ]]; then
            echo "Missing read credentials: dry-run unavailable" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_READONLY_KEY" node scripts/core43_cal04_scheduled_dryrun.cjs > core43-cal04-report.json
          node -e 'const r=require("./core43-cal04-report.json"); console.log("Checked: "+r.checked+", ready: "+r.ready+", duplicates: "+r.duplicates+", skipped: "+r.skipped+", writes: "+r.databaseWrites)' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic artifact
        if: hashFiles('core43-cal04-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: core43-cal04-readonly-report
          path: core43-cal04-report.json
          retention-days: 7
