name: CORE43-CAL-04 scheduled dry-run
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap_ledger:
        description: 'Initialize a ledger only when no previous successful run exists'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/core43_cal04_scheduled_dryrun.cjs'
      - 'scripts/core43_cal04_restore_ledger.sh'
      - 'scripts/test_core43_cal04_scheduled_dryrun.cjs'
      - 'scripts/test_core43_cal04_two_run_integration.cjs'
      - 'scripts/test_core43_cal04_failure_modes.cjs'
      - 'scripts/test_core43_cal06_workflow_guards.cjs'
      - 'scripts/test_core43_cal06_public_acl.cjs'
      - 'scripts/core43_cal07_export.cjs'
      - 'scripts/test_core43_cal07_export.cjs'
      - 'docs/core43-cal07-signed-pregame-export.md'
      - 'scripts/core43_cal08_receiver.cjs'
      - 'scripts/test_core43_cal08_receiver.cjs'
      - 'scripts/fixtures/core43_signed_export.cjs'
      - 'docs/core43-cal08-offline-receiver.md'
      - 'scripts/core43_cal09_ledger_transfer.cjs'
      - 'scripts/test_core43_cal09_transfer.cjs'
      - 'docs/core43-cal09-ledger-transfer.md'
      - 'scripts/test_core43_cal10_chain.cjs'
      - 'scripts/fixtures/core43_ledger_worker.cjs'
      - 'docs/core43-cal10-integration.md'
      - 'docs/sql/core43-cal06-reader-migration-draft.sql'
      - 'scripts/core43_live_shadow_source_reader.cjs'
      - 'scripts/core43_supabase_readonly_report.cjs'
      - 'scripts/core43_cal03_capture_plan.cjs'
      - '.github/workflows/core43-cal04-scheduled-dryrun.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: core43-cal04-readonly
  cancel-in-progress: false
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_core43_cal03_capture_plan.cjs
      - run: node scripts/test_core43_cal04_scheduled_dryrun.cjs
      - run: node scripts/test_core43_cal04_two_run_integration.cjs
      - run: node scripts/test_core43_cal04_failure_modes.cjs
      - run: node scripts/test_core43_cal06_workflow_guards.cjs
      - name: Verify signed pregame export with synthetic data
        run: node --test scripts/test_core43_cal07_export.cjs
      - name: Test offline export receipt and durable deduplication
        run: node --experimental-sqlite --test scripts/test_core43_cal08_receiver.cjs
      - name: Test signed SQLite transfer, rollback protection and concurrent workers
        run: node --experimental-sqlite --test scripts/test_core43_cal09_transfer.cjs
      - name: Verify the offline end-to-end calibration chain
        run: node --experimental-sqlite --test scripts/test_core43_cal10_chain.cjs
      - name: Test PUBLIC privileges in an in-memory PostgreSQL 17 database
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/core43-acl" --no-audit --no-fund --ignore-scripts @electric-sql/pglite@0.3.15
          NODE_PATH="$RUNNER_TEMP/core43-acl/node_modules" node --test scripts/test_core43_cal06_public_acl.cjs
  dry-run:
    # Keep disabled until the hosted role grants and JWT issuer are verified.
    if: >-
      false &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore last diagnostic ledger (GitHub artifacts only)
        env:
          GH_TOKEN: ${{ github.token }}
          CORE43_CAL04_LEDGER_PATH: ${{ runner.temp }}/core43-cal04-ledger.json
          CORE43_CAL04_BOOTSTRAP_LEDGER: ${{ inputs.bootstrap_ledger }}
        shell: bash
        run: bash scripts/core43_cal04_restore_ledger.sh
      - name: Read-only diagnostic report
        env:
          CORE43_CAL04_LEDGER_PATH: ${{ runner.temp }}/core43-cal04-ledger.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CORE43_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_READONLY_TOKEN: ${{ secrets.CORE43_SUPABASE_READONLY_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" || -z "$SUPABASE_READONLY_TOKEN" ]]; then
            echo "Missing read credentials: dry-run unavailable" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node scripts/core43_cal04_scheduled_dryrun.cjs > core43-cal04-report.json
          node -e 'const r=require("./core43-cal04-report.json"); console.log("Checked: "+r.checked+", ready: "+r.ready+", duplicates: "+r.duplicates+", skipped: "+r.skipped+", writes: "+r.databaseWrites)' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: core43-cal04-readonly-report
          path: core43-cal04-report.json
          if-no-files-found: error
          retention-days: 7
