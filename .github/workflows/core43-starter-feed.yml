name: CORE 4.3 confirmed starter feed
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test starter evidence provenance contract
        run: python -m unittest scripts.test_core43_source_provenance
      - name: Audit native RotoWire evidence coverage
        run: python scripts/audit_core43_rotowire_evidence.py
      - name: Check confirmed-starter feed configuration
        env:
          CORE43_STARTER_FEED_URL: ${{ secrets.CORE43_STARTER_FEED_URL }}
          CORE43_STARTER_FEED_TOKEN: ${{ secrets.CORE43_STARTER_FEED_TOKEN }}
        run: |
          if [ -z "$CORE43_STARTER_FEED_URL" ] || [ -z "$CORE43_STARTER_FEED_TOKEN" ]; then
            echo '::warning title=CORE 4.3 starter feed inactive::Missing CORE43_STARTER_FEED_URL or CORE43_STARTER_FEED_TOKEN. Verified starter evidence cannot be ingested.'
            echo '### CORE 4.3 confirmed starter feed: NATIVE FALLBACK' >> "$GITHUB_STEP_SUMMARY"
            echo 'External feed is not configured. The native RotoWire bridge checks local reports for explicit per-goalie publication timestamps and IDs. Untimestamped confirmations remain unverified.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### CORE 4.3 confirmed starter feed: CONFIGURED' >> "$GITHUB_STEP_SUMMARY"
            echo 'Feed ingestion will run. Configuration does not guarantee valid confirmed reports; check ingestion output.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Import pregame confirmed starter evidence
        env:
          CORE43_STARTER_FEED_URL: ${{ secrets.CORE43_STARTER_FEED_URL }}
          CORE43_STARTER_FEED_TOKEN: ${{ secrets.CORE43_STARTER_FEED_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ingest_core43_starter_feed.py
