name: CORE 4.3 confirmed starter feed
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import pregame confirmed starter evidence
        env:
          CORE43_STARTER_FEED_URL: ${{ secrets.CORE43_STARTER_FEED_URL }}
          CORE43_STARTER_FEED_TOKEN: ${{ secrets.CORE43_STARTER_FEED_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ingest_core43_starter_feed.py
