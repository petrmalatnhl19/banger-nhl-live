name: CORE43-CAL-03 dry-run validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/core43_cal03_capture_plan.cjs'
      - 'scripts/test_core43_cal03_capture_plan.cjs'
      - '.github/workflows/core43-cal03-dryrun.yml'
permissions:
  contents: read
jobs:
  dry-run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pure dry-run planner (no Supabase credentials)
        run: node scripts/test_core43_cal03_capture_plan.cjs
