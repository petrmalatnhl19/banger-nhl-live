name: CORE 4.3 RotoWire observations
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh official NHL roster identities
        run: python scripts/update_rosters.py
      - name: Fetch and match current RotoWire observations
        run: python scripts/parse_rotowire_goalies.py
      - name: Publish current RotoWire observations
        run: python scripts/publish_rotowire_goalies.py
      - name: Audit CORE 4.3 evidence provenance
        run: python scripts/audit_core43_rotowire_evidence.py
      - name: Archive existing RotoWire statuses to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/archive_core43_rotowire_observations.py
