name: CORE 4.3 read-only diagnostics

on:
  schedule:
    - cron: '25 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core43-readonly-diagnostics
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests
        run: |
          node scripts/test_core43_archive_coverage_audit.cjs
          node scripts/test_core43_unified_diagnostic_runner.cjs
          node scripts/test_core43_starter_evidence_quality.cjs
          node scripts/test_core43_goalie_timing_audit.cjs
          node scripts/test_core43_observation_cadence_audit.cjs
          node scripts/test_core43_confirmation_pipeline_audit.cjs
          node scripts/test_core43_goalie_feed_freshness.cjs
          node scripts/test_core43_shadow_input_readiness_audit.cjs
          node scripts/test_core43_rotowire_identity_reconcile.cjs
          node scripts/test_core43_shadow_identity_coverage.cjs
          node scripts/test_core43_new_pregame_goalie_identity.cjs
          node scripts/test_core43_pregame_goalie_gsax_bridge.cjs
          node scripts/test_core43_two_goalie_pregame_shadow.cjs
          node scripts/test_core43_frozen_shadow_outcome_evaluation.cjs
          node scripts/test_core43_capture_new_shadow.cjs
          node scripts/test_core43_pregame_source_assembly.cjs
          node scripts/test_core43_archived_gsax_snapshot_adapter.cjs
          node scripts/test_core43_live_shadow_source_reader.cjs
          node scripts/test_core43_append_only_capture_writer.cjs
          node scripts/test_core43_verify_archive_deployment.cjs
          node scripts/test_core43_manual_prospective_archive_pilot.cjs
      - name: Validate configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$SUPABASE_URL" && -n "$SUPABASE_SECRET_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CORE 4.3 diagnostic skipped: configure SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CORE 4.3 diagnostic skipped: missing server-side repository secrets." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Generate read-only report
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          node scripts/core43_unified_diagnostic_runner.cjs > core43-diagnostic.json
          node scripts/core43_diagnostic_summary.cjs core43-diagnostic.json >> "$GITHUB_STEP_SUMMARY"
          node scripts/core43_starter_evidence_quality.cjs > core43-evidence-quality.json
          node scripts/core43_goalie_timing_audit.cjs > core43-goalie-timing.json
          node scripts/core43_observation_cadence_audit.cjs > core43-observation-cadence.json
          node scripts/core43_confirmation_pipeline_audit.cjs > core43-confirmation-pipeline.json
          node scripts/core43_goalie_feed_freshness.cjs > core43-goalie-feed-freshness.json
          node scripts/core43_shadow_input_readiness_audit.cjs > core43-shadow-input-readiness.json
          node scripts/core43_shadow_identity_coverage.cjs > core43-shadow-identity-coverage.json
      - name: Upload report artifact
        if: steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core43-diagnostic
          path: |
            core43-diagnostic.json
            core43-evidence-quality.json
            core43-goalie-timing.json
            core43-observation-cadence.json
            core43-confirmation-pipeline.json
            core43-goalie-feed-freshness.json
            core43-shadow-input-readiness.json
            core43-shadow-identity-coverage.json
          retention-days: 14
