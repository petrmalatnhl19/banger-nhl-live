name: CORE43-CAL-54 durable offline ledger
on:
  pull_request:
    paths:
      - 'scripts/core43_cal54_sqlite_ledger.py'
      - 'tests/test_core43_cal54.py'
      - '.github/workflows/core43-cal54-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite-ledger-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: SQLite persistence and replay regression tests
        run: python -m unittest discover -s tests -p 'test_core43_cal54.py' -v
