name: CORE43-CAL-53 game binding and replay
on:
  pull_request:
    paths:
      - 'scripts/core43_cal49_provenance_gate.py'
      - 'scripts/core43_cal50_signature_verify.py'
      - 'scripts/core43_cal51_signed_bundle.py'
      - 'scripts/core43_cal52_source_binding.py'
      - 'scripts/core43_cal53_game_replay.py'
      - 'tests/test_core43_cal53.py'
      - '.github/workflows/core43-cal53-game-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game-replay-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify game identity and caller-ledger replay checks
        run: python -m unittest discover -s tests -p 'test_core43_cal53.py' -v
