name: NHL feed performance regression

on:
  pull_request:
    paths:
      - index.html
      - scripts/test_nhl_feed_inflight_dedup.cjs
      - scripts/test_stable_game_refresh.cjs
      - scripts/test_incremental_game_cards.cjs
      - scripts/test_detail_landing_reuse.cjs
      - scripts/test_parallel_lineup_sources.cjs
      - .github/workflows/nhl-feed-performance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_nhl_feed_inflight_dedup.cjs
      - run: node scripts/test_stable_game_refresh.cjs
      - run: node scripts/test_incremental_game_cards.cjs
      - run: node scripts/test_detail_landing_reuse.cjs
      - run: node scripts/test_parallel_lineup_sources.cjs
