name: Official NHL final goalie audit
on:
  pull_request:
    paths:
      - 'scripts/audit_official_final_goalies.py'
      - 'scripts/test_official_final_goalies.py'
      - '.github/workflows/official-final-goalie-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: official-goalie-audit-publish
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_official_final_goalies.py'
      - run: python scripts/audit_official_final_goalies.py --days 10
      - name: Publish verified audit for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/official-final-goalies.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official final NHL goalies [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: official-final-goalie-audit
          path: diagnostics/official-final-goalies.json
          retention-days: 14
