name: CORE43-CAL-51 signed bundle integration
on:
  pull_request:
    paths:
      - 'scripts/core43_cal49_provenance_gate.py'
      - 'scripts/core43_cal50_signature_verify.py'
      - 'scripts/core43_cal51_signed_bundle.py'
      - 'tests/test_core43_cal51.py'
      - '.github/workflows/core43-cal51-signed-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-bundle-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline signed manifest integration tests
        run: python -m unittest discover -s tests -p 'test_core43_cal51.py' -v
