name: CORE 4.3 MoneyPuck goalie schema check
on:
  workflow_dispatch:
  schedule:
    - cron: '25 8 * * *'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect published MoneyPuck goalie CSV
        run: python scripts/probe_moneypuck_goalies.py
      - name: Archive pregame goalie data snapshot
        run: python scripts/archive_core43_goalies.py
      - name: Store snapshot in Supabase (only when secrets configured)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ingest_core43_goalies_supabase.py
      - name: Store MoneyPuck goalie identity mapping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ingest_core43_goalie_identities.py
      - name: Save immutable goalie snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core43-goalie-snapshot-${{ github.run_id }}
          path: diagnostics/core43-goalie-snapshots/
          if-no-files-found: warn
          retention-days: 90
      - name: Save schema diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core43-moneypuck-goalie-schema
          path: diagnostics/core43-moneypuck-goalies-schema.json
          if-no-files-found: warn
