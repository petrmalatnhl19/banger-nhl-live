<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BANGER NHL LIVE – test hlasu VOICE-08</title><style>body{margin:0;background:#081322;color:#f5f8ff;font:16px system-ui;padding:22px;max-width:600px}h1{font-size:24px;color:#55d7ff}button{background:#126e9b;color:white;border:1px solid #56caff;border-radius:12px;padding:15px;margin:7px 4px;font-size:16px}button:disabled{opacity:.4}p{line-height:1.5}#status{padding:14px;background:#15283d;border-radius:12px}select{padding:12px;max-width:100%;background:#18354b;color:white}</style></head><body><h1>🏒 BANGER NHL LIVE</h1><p>Samostatná poslechová ukázka ženského hlasu Androidu. Nemění veřejnou aplikaci ani PR #344. Hlas závisí na nastavení telefonu.</p><label for="voice">Český hlas</label><p><select id="voice"></select></p><p><button id="goal">🥅 Gól</button><button id="shot">🏒 Střela</button><button id="penalty">⏱️ Trest</button><button id="stop">■ Zastavit</button></p><p id="status" role="status">Připraveno. Klepni na Gól.</p><script>
(()=>{'use strict';const synth=window.speechSynthesis,select=document.querySelector('#voice'),status=document.querySelector('#status');let token=0;const samples={goal:[['Góóóól!',.8,1.19],['Dallas Stars dávají gól! Jason Robertson překonává brankáře a domácí jdou do vedení!',1.1,1.2]],shot:[['Robertson vystřelil! Brankář vyráží puk před sebe!',1.07,1.08]],penalty:[['Rozhodčí zvedá ruku. Následuje dvouminutový trest.',.94,.96]]};function voices(){const list=synth?.getVoices().filter(v=>/^cs([-_]|$)/i.test(v.lang))||[];select.replaceChildren();list.forEach((v,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=v.name+(v.localService?' · v telefonu':'');select.append(o)});if(!list.length){const o=document.createElement('option');o.textContent='Výchozí český hlas zařízení';select.append(o)}return list}let available=[];function refresh(){available=voices()}function play(kind){if(!synth||!window.SpeechSynthesisUtterance){status.textContent='Tento prohlížeč nepodporuje převod textu na řeč.';return}const id=++token;synth.cancel();const segments=samples[kind];let index=0;function next(){if(id!==token)return;if(index===segments.length){status.textContent='Ukázka dokončena.';return}const [text,rate,pitch]=segments[index++];const u=new SpeechSynthesisUtterance(text);u.lang='cs-CZ';u.rate=rate;u.pitch=pitch;u.volume=1;const v=available[Number(select.value)];if(v)u.voice=v;u.onstart=()=>{if(id===token)status.textContent='Právě říká: '+text};u.onend=next;u.onerror=e=>{if(id===token&&e.error!=='canceled'&&e.error!=='interrupted')status.textContent='Chyba hlasu: '+e.error};synth.speak(u)}next()}for(const k of Object.keys(samples))document.querySelector('#'+k).addEventListener('click',()=>play(k));document.querySelector('#stop').addEventListener('click',()=>{token++;synth?.cancel();status.textContent='Zastaveno.'});select.addEventListener('change',()=>{token++;synth?.cancel()});if(synth){refresh();synth.addEventListener?.('voiceschanged',refresh)}else status.textContent='Hlas není v tomto prohlížeči dostupný.'})();
</script></body></html>
