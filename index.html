-size:clamp(29px,7vw,56px);font-weight:900;color:#6aeaff;white-space:nowrap;text-shadow:0 0 20px #00baff88}.arena h3{margin:24px 0 10px;color:#70eaff}.arenastat{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #24506c;text-align:center}.arenastat span:nth-child(2){color:#b0d0e2}.event{border-left:3px solid #39dcff;padding:10px 14px;margin:8px 0;background:#092a45;border-radius:0 10px 10px 0}.event small{color:#9abdd3}.arena .close{position:static}.boxsection{margin:18px 0}.boxsection h4{color:#8befff;margin:14px 0 6px}.boxscroll{overflow-x:auto}.boxtable{width:100%;border-collapse:collapse;min-width:500px;font-size:13px}.boxtable th,.boxtable td{padding:9px 8px;text-align:right;border-bottom:1px solid #25506a;white-space:nowrap}.boxtable th:first-child,.boxtable td:first-child{text-align:left}.boxtable th{color:#86bcd4}.boxtable td:first-child{color:#e5fbff}.arena-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.arena-tabs .btn.active{border-color:#5df2ff;background:#135579}.periodgoals{margin:14px 0 20px}.periodtitle{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #276a8d;padding:10px 3px;color:#76eaff;font-size:17px}.periodtitle span{font-size:12px;color:#a0c9db;font-weight:400}.nogols{color:#9bbacc;padding:4px 12px}.periodscoretitle{margin:18px 0 8px!important;color:#83e8ff}.periodscore{border:1px solid #245b7a;border-radius:12px;padding:10px;background:#08233b;overflow-x:auto}.periodscoreline{display:grid;grid-template-columns:minmax(80px,1.5fr) repeat(var(--periods,3),minmax(46px,1fr));gap:8px;align-items:center;text-align:center;padding:7px 0;white-space:nowrap}.periodscoreline b,.periodscoreline>span:first-child{text-align:left}.periodscorehead{color:#83c8e9;font-size:11px;border-block:1px solid #245b7a}.periodnote{color:#9cbdd0}</style></head><body><div class="wrap">

async function get(url,start=0){const base="https://xxwqeiuyislnoxsmjuul.supabase.co/functions/v1/nhl-feed";let kind,extra="";if(url.includes("/gamecenter/")){kind=url.includes("/boxscore")?"boxscore":"game";extra="&id="+encodeURIComponent(url.split("/gamecenter/")[1].split("/")[0])}else if(url.includes("/score/")){kind="score";extra="&date="+encodeURIComponent(url.split("/score/")[1])}else{kind=url.includes("/goalie/")?"goalies":"skaters";extra="&start="+start}const r=await fetch(base+"?kind="+kind+extra,{headers:{"apikey":"sb_publishable_SfeHMIvUkYTuD3jCrWub8w_fPIY0B-G"}});if(!r.ok)throw Error("Supabase NHL feed HTTP "+r.status);return await r.json()}

async function games(){S.tab='games';$('search').classList.add('hidden');$('daynav').classList.remove('hidden');$('sort').classList.add('hidden');$('status').textContent='Načítám zápasy '+S.date+'…';$('content').innerHTML='';try{const d=await get('https://api-web.nhle.com/v1/score/'+S.date);const arr=d.games||[];$('status').textContent=arr.length+' zápasů · aktualizováno '+new Date().toLocaleTimeString('cs-CZ');const live=arr.filter(g=>['LIVE','CRIT'].includes(g.gameState)).length,finished=arr.filter(g=>['OFF','FINAL'].includes(g.gameState)).length;const metrics='<div class="metrics"><div class="metric"><b>'+arr.length+'</b><span>ZÁPASŮ</span></div><div class="metric"><b>'+live+'</b><span>PRÁVĚ ŽIVĚ</span></div><div class="metric"><b>'+finished+'</b><span>DOHRÁNO</span></div></div>';if(!arr.length){$('content').innerHTML='<div class="empty">Pro tento den nejsou naplánované zápasy. Zkus jiné datum.</div>';return}$('content').innerHTML=metrics+'<div class="grid">'+arr.map(g=>'<article class="game"><div class="gamehead"><span>'+safe(g.gameType===2?'NHL REGULAR SEASON':'NHL')+'</span><span>'+state(g.gameState)+'</span></div><div class="score">'+team(g.awayTeam)+'<div class="nums">'+safe(g.awayTeam?.score??'–')+' <span class="vs">:</span> '+safe(g.homeTeam?.score??'–')+'</div>'+team(g.homeTeam)+'</div><button class="btn" data-game="'+g.id+'">Otevřít LIVE centrum ↗</button><div class="goals hidden" id="g'+g.id+'"></div></article>').join('')+'</div>';document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>detail(b.dataset.game,b))}catch(e){$('status').textContent='Nepodařilo se načíst NHL data';$('content').innerHTML='<div class="empty">⚠️ Připojení k NHL API selhalo: '+safe(e.message)+'. Zkus tlačítko Obnovit. Pokud chyba přetrvá, bude potřeba serverové propojení přes Supabase.</div>'}}
async function detail(id,b){b.textContent='Načítám LIVE centrum…';$('liveArena').classList.remove('hidden');$('arenaBody').innerHTML='<button class="btn close" id="closeArena">✕ Zavřít</button><h2>Načítám detail NHL…</h2>';$('closeArena').onclick=closeArena;document.body.style.overflow='hidden';try{const d=await get('https://api-web.nhle.com/v1/gamecenter/'+id+'/landing');if($('liveArena').classList.contains('hidden'))return;const away=d.awayTeam||{},home=d.homeTeam||{};const ab=t=>t.abbrev||t.commonName?.default||t.name?.default||'NHL';const img=t=>t.logo?'<img src="'+safe(t.logo)+'" alt="">':'';const periods=d.summary?.scoring||[];const personName=n=>{if(typeof n==='string')return n;if(!n||typeof n!=='object')return '';return n.default||[n.firstName?.default||n.firstName,n.lastName?.default||n.lastName].filter(x=>typeof x==='string').join(' ')||''};const periodLabel=p=>p.periodDescriptor?.periodType==='OT'?'Prodloužení':p.periodDescriptor?.periodType==='SO'?'Nájezdy':(p.periodDescriptor?.number||1)+'. třetina';const events=periods.length?periods.map((p,i)=>{const goals=p.goals||[];const title=p.periodDescriptor?.periodType==='OT'?'Prodloužení':p.periodDescriptor?.periodType==='SO'?'Nájezdy':(p.periodDescriptor?.number||i+1)+'. třetina';return '<section class="periodgoals"><h4 class="periodtitle">'+safe(title)+' <span>'+goals.length+' gólů</span></h4>'+(goals.length?goals.map(g=>{const scorer=personName(g.name)||[personName(g.firstName),personName(g.lastName)].filter(Boolean).join(' ')||'Střelec';const assists=(g.assists||[]).map(x=>personName(x.name)||[personName(x.firstName),personName(x.lastName)].filter(Boolean).join(' ')).filter(Boolean);return '<div class="event"><small>'+safe(g.timeInPeriod||'—')+' · '+safe(personName(g.teamAbbrev)||g.teamAbbrev||'')+'</small><div>🥅 <b>'+safe(scorer)+'</b> '+safe(g.awayScore??'')+' : '+safe(g.homeScore??'')+'</div><small>Asistence: '+safe(assists.join(', ')||'bez asistence')+'</small></div>'}).join(''):'<p class="nogols">Bez gólu</p>')+'</section>'}).join(''):'<p>Zatím nejsou dostupné záznamy gólů.</p>';const periodScores=(()=>{const lines=(d.summary?.scoring||[]).map((p,i)=>{const kind=p.periodDescriptor?.periodType;const number=p.periodDescriptor?.number||i+1;const title=kind==='OT'?'PROD.':kind==='SO'?'NÁJEZDY':number+'. TŘ.';const gs=p.goals||[];const count=(ab)=>gs.filter(g=>{const t=g.teamAbbrev;return (typeof t==='string'?t:t?.default)===ab}).length;return {title,away:count(away.abbrev),home:count(home.abbrev),kind}});if(!lines.length)return '<p class="periodnote">Výsledky třetin zatím nejsou dostupné.</p>';return '<div class="periodscore"><div class="periodscoreline"><b>'+safe(away.abbrev||'HOSTÉ')+'</b>'+lines.map(x=>'<span>'+safe(x.away)+'</span>').join('')+'</div><div class="periodscoreline periodscorehead"><span>TŘETINY</span>'+lines.map(x=>'<span>'+safe(x.title)+'</span>').join('')+'</div><div class="periodscoreline"><b>'+safe(home.abbrev||'DOMÁCÍ')+'</b>'+lines.map(x=>'<span>'+safe(x.home)+'</span>').join('')+'</div></div>'})();const shotsAway=away.sog??away.shotsOnGoal,shotsHome=home.sog??home.shotsOnGoal;const stat=(label,x,y)=>x==null&&y==null?'':'<div class="arenastat"><b>'+safe(x??'—')+'</b><span>'+label+'</span><b>'+safe(y??'—')+'</b></div>';const pd=d.periodDescriptor||{};const clock=d.clock?.timeRemaining;const status=state(d.gameState);$('arenaBody').innerHTML='<div class="arenatop"><div class="tag">BANGER NHL · GAME CENTER</div><button class="btn close" id="closeArena">✕ Zavřít</button></div><p>'+safe(status)+(pd.number?' · '+safe(pd.number)+'. třetina':'')+(clock?' · '+safe(clock):'')+'</p><div class="arenascore"><div class="arenateam">'+img(away)+safe(ab(away))+'</div><div class="arenanum">'+safe(away.score??'–')+' : '+safe(home.score??'–')+'</div><div class="arenateam">'+img(home)+safe(ab(home))+'</div></div><h3 class="periodscoretitle">Výsledky třetin</h3>'+periodScores+'<h3>📊 Statistiky zápasu</h3><div id="matchTeamStats">'+stat('Střely na branku',shotsAway,shotsHome)+'<p style="color:#8ba9c5">Načítám další týmové statistiky…</p></div><h3>🥅 Góly a asistence</h3>'+(events||'<p>Zatím nejsou dostupné záznamy gólů.</p>')+'<div class="boxsection"><h3>🏒 Statistiky hráčů a brankářů</h3><div id="boxscoreContent">Načítám sestavy a statistiky…</div></div><p style="color:#89b0c8">Data z NHL · aktualizace při opětovném otevření zápasu.</p>';$('closeArena').onclick=closeArena;b.textContent='Otevřít LIVE centrum ↗';loadBoxscore(id)}catch(e){$('arenaBody').innerHTML='<button class="btn close" id="closeArena">✕ Zavřít</button><h2>Detail není dostupný</h2><p>'+safe(e.message)+'</p>';$('closeArena').onclick=closeArena;b.textContent='Zkusit znovu'}}async function loadBoxscore(id){if(!$('boxscoreContent'))return;try{const [d,landing]=await Promise.all([get('https://api-web.nhle.com/v1/gamecenter/'+id+'/boxscore'),get('https://api-web.nhle.com/v1/gamecenter/'+id+'/landing').catch(()=>null)]);if(!$('boxscoreContent'))return;const ps=d.playerByGameStats||{},teams=[['awayTeam','Hosté'],['homeTeam','Domácí']];const val=(p,...keys)=>{for(const k of keys){if(p?.[k]!==null&&p?.[k]!==undefined)return p[k]}return null};const label=p=>{const n=p.name||p.fullName;return typeof n==='string'?n:(n?.default||[p.firstName?.default,p.lastName?.default].filter(Boolean).join(' ')||'Hráč')};const fmt=v=>v==null?'—':String(v);const skaterCols=[['goals','G'],['assists','A'],['points','B'],['sog','Střely'],['hits','Hity'],['blockedShots','Bloky'],['plusMinus','+/-'],['pim','TM'],['powerPlayGoals','G PP'],['faceoffWinningPctg','Buly %'],['takeaways','Zisky'],['giveaways','Ztráty'],['shifts','Střídání'],['toi','Čas']];const goalieCols=[['decision','Výsledek'],['saves','Zákroky'],['shotsAgainst','Střely'],['goalsAgainst','G proti'],['savePctg','SV%'],['toi','Čas']];const field=(p,k)=>k==='blockedShots'?val(p,'blockedShots','blockedShotAttempts'):k==='faceoffWinningPctg'?val(p,'faceoffWinningPctg','faceoffPctg'):k==='savePctg'?val(p,'savePctg','savePercentage'):k==='sog'?val(p,'sog','shots'):val(p,k);const table=(arr,goalie)=>{const cols=goalie?goalieCols:skaterCols;return '<div class="boxscroll"><table class="boxtable"><thead><tr><th>Hráč</th>'+cols.map(c=>'<th title="'+safe(c[1])+'">'+safe(c[1])+'</th>').join('')+'</tr></thead><tbody>'+arr.map(p=>'<tr><td>'+safe(label(p))+'</td>'+cols.map(([k])=>'<td>'+safe(fmt(field(p,k)))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'};const players={};const parts=teams.map(([key,title])=>{const t=ps[key]||{},skaters=['forwards','defense'].flatMap(k=>Array.isArray(t[k])?t[k]:[]),goalies=Array.isArray(t.goalies)?t.goalies:[];players[key]={skaters,goalies};return '<section class="boxsection"><h3>'+title+' · '+safe(d[key]?.abbrev||'')+'</h3>'+(skaters.length?'<h4>Hráči v poli</h4>'+table(skaters,false):'<p>Individuální statistiky hráčů zatím nejsou dostupné.</p>')+(goalies.length?'<h4>Brankáři</h4>'+table(goalies,true):'')+'</section>'}).join('');const sums=teams.map(([key])=>{const arr=players[key].skaters;const sum=k=>arr.reduce((n,p)=>n+(Number(field(p,k))||0),0);return {hits:sum('hits'),blocks:sum('blockedShots'),pim:sum('pim'),takeaways:sum('takeaways'),giveaways:sum('giveaways'),shots:val(d[key],'sog','shotsOnGoal')??sum('sog')}});const line=(label,a,b)=>'<div class="arenastat"><b>'+safe(fmt(a))+'</b><span>'+safe(label)+'</span><b>'+safe(fmt(b))+'</b></div>';const havePlayers=players.awayTeam.skaters.length+players.homeTeam.skaters.length>0;const teamStats=havePlayers?'<p style="color:#9abdd3;text-align:center">'+safe(d.awayTeam?.abbrev||'Hosté')+' — '+safe(d.homeTeam?.abbrev||'Domácí')+'</p>'+[['Střely na branku','shots'],['Hity','hits'],['Zblokované střely','blocks'],['Trestné minuty','pim'],['Zisky puku','takeaways'],['Ztráty puku','giveaways']].map(([label,k])=>line(label,sums[0][k],sums[1][k])).join('')+'<small style="color:#8ba9c5">Součty z individuálních statistik hráčů.</small>':'';const displayName=n=>{if(typeof n==='string')return n;if(!n||typeof n!=='object')return '';return n.default||[n.firstName?.default||n.firstName,n.lastName?.default||n.lastName].filter(x=>typeof x==='string').join(' ')||''};const penaltyPeriods=landing?.summary?.penalties||[];const penalties=penaltyPeriods.map((period,i)=>{const arr=period.penalties||[];const kind=period.periodDescriptor?.periodType;const title=kind==='OT'?'Prodloužení':kind==='SO'?'Nájezdy':(period.periodDescriptor?.number||i+1)+'. třetina';return '<section class="periodgoals"><h4 class="periodtitle">'+safe(title)+' <span>'+arr.length+' vyloučení</span></h4>'+(arr.length?arr.map(x=>{const player=displayName(x.committedByPlayer)||displayName(x.playerName)||displayName(x.name)||'Hráč neuveden';const reason=displayName(x.descKey)||displayName(x.type)||'Vyloučení';return '<div class="event"><small>'+safe(x.timeInPeriod||'—')+' · '+safe(displayName(x.teamAbbrev)||x.teamAbbrev||'')+'</small><div>'+safe(player)+' · '+safe(reason)+' · '+safe(x.duration??'—')+' min</div></div>'}).join(''):'<p class="nogols">Bez vyloučení</p>')+'</section>'}).join('');if($('matchTeamStats'))$('matchTeamStats').innerHTML=teamStats||'<p>Další týmové statistiky zatím nejsou dostupné.</p>';$('boxscoreContent').innerHTML=parts+(penalties?'<h3>⏱ Vyloučení</h3>'+penalties:'')+(Object.keys(ps).length===0?'<p>Soupisky a individuální statistiky zatím NHL pro tento zápas neposkytuje.</p>':'')}catch(e){if($('boxscoreContent'))$('boxscoreContent').textContent='Statistiky zápasu se nepodařilo načíst: '+e.message}}
function closeArena(){$('liveArena').classList.add('hidden');document.body.style.overflow=''}$('liveArena').onclick=e=>{if(e.target===$('liveArena'))closeArena()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeArena()});
const season=()=>{const d=new Date(),y=d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;return ''+y+(y+1)};
async function stats(type){S.tab=type;S.expanded=false;S.rows=[];$('daynav').classList.add('hidden');$('search').classList.remove('hidden');$('sort').classList.remove('hidden');$('sort').innerHTML=type==='goalies'?'<option value="wins">Výhry ↓</option><option value="savePctg">Úspěšnost ↓</option><option value="gamesPlayed">Zápasy ↓</option><option value="goalsAgainstAverage">Průměr inkasovaných ↑</option>':'<option value="points">Body ↓</option><option value="goals">Góly ↓</option><option value="assists">Asistence ↓</option><option value="shots">Střely ↓</option><option value="gamesPlayed">Zápasy ↓</option>';$('search').value='';$('content').innerHTML='';$('status').textContent='Načítám kompletní žebříček NHL…';try{const endpoint=type==='goalies'?'goalie':'skater';const url='https://api.nhle.com/stats/rest/en/'+endpoint+'/summary';const first=await get(url,0);if(S.tab!==type)return;let rows=first.data||[];const total=Math.min(Number(first.total||first.totalRecords||rows.length),2000);const starts=[];for(let i=100;i<total;i+=100)starts.push(i);for(let i=0;i<starts.length;i+=4){const batch=await Promise.all(starts.slice(i,i+4).map(async start=>{const page=await get(url,start);return page.data||[]}));if(S.tab!==type)return;rows.push(...batch.flat());$('status').textContent='Načteno '+rows.length+' z '+total+' hráčů…'}const seen=new Set();S.rows=rows.filter(r=>{const id=r.playerId??r[endpoint+'Id']??r[endpoint+'FullName']+'|'+r.teamAbbrevs;if(seen.has(id))return false;seen.add(id);return true});renderStats();$('status').textContent='Kompletní statistiky: '+S.rows.length+' hráčů · sezóna '+season()}catch(e){$('status').textContent='Načítání statistik selhalo';$('content').innerHTML='<div class="empty">⚠️ Nepodařilo se načíst celý žebříček: '+safe(e.message)+'. Zkus Obnovit.</div>'}}
function renderStats(){const isG=S.tab==='goalies',key=$('sort').value,q=$('search').value.trim().toLocaleLowerCase('cs');const nameKey=isG?'goalieFullName':'skaterFullName';const base=[...S.rows].sort((a,b)=>{const av=Number(a[key]),bv=Number(b[key]);const primary=key==='goalsAgainstAverage'?(Number.isFinite(av)?av:999)-(Number.isFinite(bv)?bv:999):(Number.isFinite(bv)?bv:0)-(Number.isFinite(av)?av:0);if(primary!==0)return primary;const tieKeys=isG?['wins','savePctg','gamesPlayed']:['points','goals','assists','gamesPlayed'];for(const t of tieKeys){if(t===key)continue;const diff=Number(b[t]??0)-Number(a[t]??0);if(diff!==0)return diff}return String(a[nameKey]||'').localeCompare(String(b[nameKey]||''),'cs')});const ranked=base.map((r,i)=>({...r,_rank:i+1}));const filtered=ranked.filter(r=>(String(r[nameKey]||'')+' '+String(r.teamAbbrevs||'')).toLocaleLowerCase('cs').includes(q));const rows=S.expanded?filtered:filtered.slice(0,10);const cols=isG?[['goalieFullName','Brankář'],['teamAbbrevs','Tým'],['gamesPlayed','Z'],['wins','V'],['losses','P'],['savePctg','SV%'],['goalsAgainstAverage','GAA']]:[['skaterFullName','Hráč'],['teamAbbrevs','Tým'],['gamesPlayed','Z'],['goals','G'],['assists','A'],['points','B'],['shots','Střely']];const fmt=(r,k)=>{const v=r[k];if(v===null||v===undefined)return '–';if(k==='savePctg'){const n=Number(v);return Number.isFinite(n)?(n<=1?n*100:n).toLocaleString('cs-CZ',{minimumFractionDigits:1,maximumFractionDigits:2})+' %':'–'}if(k==='goalsAgainstAverage'){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2}):'–'}return String(v)};$('content').innerHTML='<div class="status">Žebříček: '+safe($('sort').selectedOptions[0]?.textContent||'')+' · '+filtered.length+' z '+base.length+' hráčů · zobrazeno '+rows.length+'</div><div class="tablewrap"><table><thead><tr><th>Poř.</th>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><td><b style="color:#41eaff">'+r._rank+'.</b></td>'+cols.map(c=>'<td>'+(c[0]===nameKey?'<button class="playerlink" data-player="'+safe(r.playerId??'')+'">'+safe(fmt(r,c[0]))+'</button>':safe(fmt(r,c[0])))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+(filtered.length>10?'<div style="text-align:center;margin:18px"><button class="btn" id="showMore">'+(S.expanded?'Zobrazit TOP 10 ↑':'Více hráčů ('+(filtered.length-10)+') ↓')+'</button></div>':'');const more=$('showMore');if(more)more.onclick=()=>{S.expanded=!S.expanded;renderStats()};document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>{const row=rows.find(r=>String(r.playerId??'')===b.dataset.player);if(row)showProfile(row,isG)})}
function showProfile(r,isG){const name=String(r[isG?'goalieFullName':'skaterFullName']||'Hráč NHL'),id=Number(r.playerId)||0;const fields=isG?[['gamesPlayed','Zápasy'],['wins','Výhry'],['losses','Prohry'],['savePctg','Úspěšnost'],['goalsAgainstAverage','GAA'],['shutouts','Nuly']]:[['gamesPlayed','Zápasy'],['goals','Góly'],['assists','Asistence'],['points','Body'],['shots','Střely'],['plusMinus','+/-'],['hits','Hity'],['blockedShotAttempts','Bloky'],['powerPlayPoints','Body PP']];const format=(key)=>{const v=r[key];if(v===undefined||v===null)return '—';if(key==='savePctg'){const n=Number(v);return Number.isFinite(n)?(n<=1?n*100:n).toLocaleString('cs-CZ',{maximumFractionDigits:2})+' %':'—'}if(key==='goalsAgainstAverage')return Number(v).toFixed(2);return String(v)};const image=id>0?'https://assets.nhle.com/mugs/nhl/20262027/'+safe(r.teamAbbrevs?.split(',')[0]||'')+'/'+id+'.png':'';$('profileBody').innerHTML='<button class="btn close" id="closeProfile" aria-label="Zavřít profil">✕</button><div class="tag">BANGER PLAYER PROFILE</div><div class="profilehead">'+(image?'<img class="portrait" src="'+image+'" alt="Fotografie hráče" onerror="this.style.display=\'none\'">':'')+'<div><h2>'+safe(name)+'</h2><p>'+safe(r.teamAbbrevs||'NHL')+' · '+(isG?'Brankář':'Hráč v poli')+'</p><div class="tag">SEZÓNA '+safe(season())+'</div></div></div><div class="profilegrid">'+fields.map(([key,label])=>'<div><b>'+safe(format(key))+'</b><small>'+label+'</small></div>').join('')+'</div><p>Údaje vycházejí ze sezónních statistik NHL. Nevyplněné hodnoty nejsou v aktuálním zdroji dostupné.</p>';$('playerProfile').classList.remove('hidden');$('closeProfile').onclick=closeProfile;document.body.style.overflow='hidden'}function closeProfile(){$('playerProfile').classList.add('hidden');document.body.style.overflow=''}$('playerProfile').onclick=e=>{if(e.target===$('playerProfile'))closeProfile()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeProfile()});
function activate(t){for(const [k,v] of [['tabGames','games'],['tabSkaters','skaters'],['tabGoalies','goalies']])$(k).classList.toggle('active',t===v);t==='games'?games():stats(t)}
$('tabGames').onclick=()=>activate('games');$('tabSkaters').onclick=()=>activate('skaters');$('tabGoalies').onclick=()=>activate('goalies');$('refresh').onclick=()=>activate(S.tab);$('date').onchange=e=>{S.date=e.target.value;games()};$('search').oninput=()=>{S.expanded=false;if(S.rows.length)renderStats()};$('sort').onchange=()=>{if(S.rows.length)renderStats()};function shiftDay(n){const d=new Date(S.date+'T12:00:00');d.setDate(d.getDate()+n);S.date=localDate(d);$('date').value=S.date;games()}$('prevDay').onclick=()=>shiftDay(-1);$('nextDay').onclick=()=>shiftDay(1);$('today').onclick=()=>{S.date=localDate(new Date());$('date').value=S.date;games()};setInterval(()=>{if(S.tab==='games')games()},60000);games();
</script></body></html>
