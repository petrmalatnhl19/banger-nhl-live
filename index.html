/* BANGER 1.0 — HOLOGRAPHIC ARENA */
:root{--cyan:#6bf5ff;--panel:#081a32;--muted:#a3c2d6}
body{background:radial-gradient(ellipse 75% 40% at 50% -10%,#1470a0 0%,transparent 75%),radial-gradient(ellipse 70% 60% at 85% 75%,#132b62 0%,transparent 80%),#020916}
body:before{background:repeating-linear-gradient(0deg,transparent 0 39px,#45eaff0b 40px),repeating-linear-gradient(90deg,transparent 0 39px,#45eaff0b 40px);background-size:40px 40px;opacity:.55;mask-image:linear-gradient(#0009,#0002)}
.wrap:before{content:"";position:fixed;top:-350px;left:50%;width:800px;height:800px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#19b8ff13,transparent 67%);pointer-events:none}
.top{padding:12px 0}.puck{border-radius:18px;position:relative;animation:puckGlow 4s ease-in-out infinite;box-shadow:0 0 20px #16c9ff70,inset 0 0 22px #43dfff22}
@keyframes puckGlow{50%{box-shadow:0 0 44px #16c9ffaa,inset 0 0 28px #43dfff55}}
.live{background:#041b2bb8;box-shadow:0 0 22px #14d8ff22,inset 0 0 15px #15dfff10}.dot{animation:livePulse 2s infinite}@keyframes livePulse{50%{opacity:.45;box-shadow:0 0 20px #52fca9}}
.hero{min-height:245px;display:flex;flex-direction:column;justify-content:center;isolation:isolate;background:linear-gradient(110deg,#0a2847f5 8%,#0a2942e8 65%,#061e37ee);border-color:#55dfff88;box-shadow:0 15px 55px #0008,inset 0 0 32px #22bfff15}
.hero:after{display:none}.hero h2{max-width:570px;position:relative;z-index:2;text-shadow:0 0 25px #26dfff55}.hero p,.hero .tag{position:relative;z-index:2}
.rink-scene{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;opacity:.9}
.rink-glow{position:absolute;right:-8%;top:-35%;width:70%;height:170%;background:radial-gradient(ellipse,#37dfff2c,transparent 60%);filter:blur(15px)}
.rink{position:absolute;right:-10%;top:-36%;width:70%;height:160%;border:3px solid #7bfaff88;border-radius:46%;transform:perspective(540px) rotateX(59deg) rotateZ(-24deg);box-shadow:0 0 0 14px #1dd9ff0c,0 0 40px #2eeaff70,inset 0 0 35px #30dfff44;background:linear-gradient(90deg,transparent 32%,#ff547b70 32.3%,transparent 32.8%,transparent 66%,#ff547b70 66.3%,transparent 66.8%),linear-gradient(0deg,transparent 49.7%,#ff547b55 50%,transparent 50.3%),radial-gradient(ellipse,#1bc3ff16,#0a3e6088)}
.rink:before{content:"";position:absolute;left:50%;top:50%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #e8517990;border-radius:50%;box-shadow:0 0 20px #f9557770}
.rink:after{content:"";position:absolute;inset:8%;border:1px dashed #78dfff44;border-radius:46%}
.scanbeam{position:absolute;inset:-30% -40%;background:linear-gradient(105deg,transparent 43%,#a6f9ff0b 49%,#8ffaff25 50%,transparent 54%);animation:arenaScan 10s linear infinite}@keyframes arenaScan{from{transform:translateX(-70%)}to{transform:translateX(70%)}}
.btn,.date,.search,.sort{transition:background .2s,border-color .2s,box-shadow .2s,transform .2s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0)}
.game,.metric,.tablewrap,.profilecard,.arenacard{position:relative;box-shadow:0 16px 45px #0007,inset 0 1px #d9ffff16;backdrop-filter:blur(8px)}
.game{overflow:hidden;transition:transform .22s,border-color .22s,box-shadow .22s;background:linear-gradient(145deg,#0d3453ef,#07162df5)}.game:before{content:"";position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,#65f5ff9c,transparent)}.game:hover{transform:translateY(-4px);border-color:#60eaff;box-shadow:0 18px 40px #000a,0 0 25px #18dfff28}
.team img,.arenateam img{filter:drop-shadow(0 0 14px #8feaff55)}.nums,.arenanum{background:linear-gradient(180deg,#fff,#71efff);background-clip:text;-webkit-background-clip:text;color:transparent}
.metric{background:linear-gradient(160deg,#0e3552,#071c35);border-color:#357a9a}.metric b{font-size:clamp(22px,3vw,32px);text-shadow:0 0 20px #20eaff55}
.arenacard{background:linear-gradient(160deg,#0d3654f9,#041325 75%);border:1px solid #6af2ff;box-shadow:0 0 0 1px #54eaff20,0 0 75px #09cfff55}.arenascore{background:radial-gradient(ellipse at center,#1cbcff1c,transparent 72%);border-radius:14px}.arenanum{filter:drop-shadow(0 0 12px #17cfff55)}
.arenastat{position:relative}.arenastat b{color:#d7faff;font-variant-numeric:tabular-nums}.arenastat span:nth-child(2){font-size:13px}.event{transition:border-color .2s,background .2s}.event:hover{background:#0d3c5a;border-color:#b3fbff}
.periodscore,.boxscroll{box-shadow:inset 0 0 25px #13cfff0a}.periodtitle{background:linear-gradient(90deg,#1beaff12,transparent);padding-left:12px}

.top{margin-bottom:12px;padding:8px 0 14px;border-bottom:1px solid #2d789355}.brand .puck{width:48px;height:48px;font-size:27px;border-radius:13px}.brand h1{font-size:clamp(22px,4vw,33px)}.brand .tag{font-size:10px;letter-spacing:1.6px}.toolbar{margin:12px 0 16px}.wrap{padding-top:12px}@media(max-width:480px){.top{gap:8px}.brand{gap:9px}.live{font-size:10px;padding:7px 9px}}
/* 1.0.2 – LIVE MATCH CARDS */
.game{border-radius:19px;padding:18px 17px 16px;isolation:isolate}
.game:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse 75% 50% at 50% 60%,#22c9ff12,transparent 80%)}
.gamehead{gap:8px;min-height:26px}.game-league{color:#8daec6;font-size:10px;letter-spacing:1.3px}.game-state{padding:6px 10px;border:1px solid #396a85;border-radius:30px;color:#a7c7d8;background:#061b30;font-size:11px}
.game-stage{text-align:center;color:#8eafc8;letter-spacing:2px;font-size:10px;font-weight:800;margin:13px 0 -6px}
.game .score{margin:17px 0 21px;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:7px}
.game .team{font-size:20px;letter-spacing:1px}.game .team img{width:76px;height:76px;margin-bottom:9px;transition:transform .25s,filter .25s}.game:hover .team img{transform:scale(1.07);filter:drop-shadow(0 0 17px #81eaff8c)}
.game .nums{font-size:clamp(26px,3vw,37px);letter-spacing:-1px;filter:drop-shadow(0 0 8px #4ddfff30)}.game .vs{font-size:17px;color:#598eaa}
.game .btn[data-game]{border-radius:11px;border-color:#328ba9;background:linear-gradient(110deg,#0c3a5c,#104e6d);letter-spacing:.7px;font-size:12px;box-shadow:inset 0 1px #b6faff2b}
.game-live{border-color:#29e5ae;box-shadow:0 0 0 1px #2de7b71c,0 0 26px #0ae3b11c,inset 0 1px #b5fff53c}
.game-live:before{background:linear-gradient(90deg,transparent,#36ffc9,transparent)}
.game-live .game-state{color:#72ffcf;border-color:#29dba3;background:#0b473c6e;animation:livePulse 2s infinite}
.game-live .game-stage{color:#78ffcc}.game-live .nums{filter:drop-shadow(0 0 12px #22ffb54d)}
.game-final .game-state{color:#b1c4d3;background:#122b3d}.game-upcoming .game-state{color:#80dfff;border-color:#2b83ae}
@media(max-width:420px){.game .team img{width:64px;height:64px}.game .nums{font-size:29px}.game .score{gap:3px}}

async function detail(id,b){b.textContent='Načítám LIVE centrum…';$('liveArena').classList.remove('hidden');$('arenaBody').innerHTML='<button class="btn close" id="closeArena">✕ Zavřít</button><h2>Načítám detail NHL…</h2>';$('closeArena').onclick=closeArena;document.body.style.overflow='hidden';try{const d=await get('https://api-web.nhle.com/v1/gamecenter/'+id+'/landing');if($('liveArena').classList.contains('hidden'))return;const away=d.awayTeam||{},home=d.homeTeam||{};const ab=t=>t.abbrev||t.commonName?.default||t.name?.default||'NHL';const img=t=>t.logo?'<img src="'+safe(t.logo)+'" alt="">':'';const periods=d.summary?.scoring||[];const personName=n=>{if(typeof n==='string')return n;if(!n||typeof n!=='object')return '';return n.default||[n.firstName?.default||n.firstName,n.lastName?.default||n.lastName].filter(x=>typeof x==='string').join(' ')||''};const periodLabel=p=>p.periodDescriptor?.periodType==='OT'?'Prodloužení':p.periodDescriptor?.periodType==='SO'?'Nájezdy':(p.periodDescriptor?.number||1)+'. třetina';const events=periods.length?periods.map((p,i)=>{const goals=p.goals||[];const title=p.periodDescriptor?.periodType==='OT'?'Prodloužení':p.periodDescriptor?.periodType==='SO'?'Nájezdy':(p.periodDescriptor?.number||i+1)+'. třetina';return '<section class="periodgoals"><h4 class="periodtitle">'+safe(title)+' <span>'+goals.length+' gólů</span></h4>'+(goals.length?goals.map(g=>{const scorer=personName(g.name)||[personName(g.firstName),personName(g.lastName)].filter(Boolean).join(' ')||'Střelec';const assists=(g.assists||[]).map(x=>personName(x.name)||[personName(x.firstName),personName(x.lastName)].filter(Boolean).join(' ')).filter(Boolean);return '<div class="event goal-event"><span class="event-marker" aria-hidden="true">●</span><small>'+safe(g.timeInPeriod||'—')+' · '+safe(personName(g.teamAbbrev)||g.teamAbbrev||'')+'</small><div>🥅 <b>'+safe(scorer)+'</b> '+safe(g.awayScore??'')+' : '+safe(g.homeScore??'')+'</div><small>Asistence: '+safe(assists.join(', ')||'b document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('teamProfile').classList.contains('hidden'))closeTeam();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-team][role="button"]')){e.preventDefault();openTeam(e.target.dataset.team)}});


let standingsRows=[],standingsView='conference';
const standingsProxy='https://xxwqeiuyislnoxsmjuul.supabase.co/functions/v1/nhl-feed?kind=standings';
const standingsGroupName={E:'Východní konference',W:'Západní konference',A:'Atlantická divize',M:'Metropolitní divize',C:'Centrální divize',P:'Pacifická divize'};
function standingsTeamCode(r){return tn(r.teamAbbrev)||r.teamAbbrev||''}
function standingsGroup(rows,label){const ordered=[...rows].sort((a,b)=>(b.points||0)-(a.points||0)||(b.regulationWins||0)-(a.regulationWins||0)||(b.regulationPlusOtWins||0)-(a.regulationPlusOtWins||0)||(b.wins||0)-(a.wins||0));return '<section class="standings-section"><h3>'+safe(label)+'</h3><div class="tablewrap"><table class="standings-table"><thead><tr><th>#</th><th>Tým</th><th>Z</th><th>V</th><th>P</th><th>PP</th><th>Body</th><th>Skóre</th></tr></thead><tbody>'+ordered.map((r,i)=>{const code=standingsTeamCode(r),team=NHL_TEAMS.find(t=>t[0]===code),isDivision=standingsView==='division',rank=isDivision?Number(r.divisionSequence):Number(r.conferenceSequence);const qualifying=isDivision?rank<=3:rank<=8;const score=(r.goalFor??r.goalsFor??'–')+':'+(r.goalAgainst??r.goalsAgainst??'–');return '<tr class="'+(qualifying?'standings-contender':'')+'"><td><span class="standings-rank">'+(i+1)+'</span></td><td><button class="standings-team" data-team="'+safe(code)+'"><img loading="lazy" src="'+safe(r.teamLogo||teamLogo(code))+'" alt=""><span>'+safe(team?.[1]||tn(r.teamName)||code)+'</span></button></td><td>'+safe(r.gamesPlayed??'–')+'</td><td>'+safe(r.wins??'–')+'</td><td>'+safe(r.losses??'–')+'</td><td>'+safe(r.otLosses??'–')+'</td><td class="standings-points">'+safe(r.points??'–')+'</td><td>'+safe(score)+'</td></tr>'}).join('')+'</tbody></table></div></section>'}
function renderStandings(){const root=$('content');const groups=standingsView==='division'?[['A','Atlantská divize'],['M','Metropolitní divize'],['C','Centrální divize'],['P','Pacifická divize']]:[['E','Východní konference'],['W','Západní konference']];root.innerHTML='<div class="standings-controls"><button class="btn '+(standingsView==='conference'?'active':'')+'" data-standings-view="conference">Konference</button><button class="btn '+(standingsView==='division'?'active':'')+'" data-standings-view="division">Divize</button></div><p class="standings-note">Pořadí podle bodů; při shodě je použito zjednodušené řazení. Modré zvýraznění je orientační, nikoliv oficiální určení postupujících. Kliknutím na tým otevřeš jeho profil.</p>'+groups.map(([key,label])=>standingsGroup(standingsRows.filter(r=>standingsView==='division'?r.divisionAbbrev===key:r.conferenceAbbrev===key),label)).join('');root.querySelectorAll('[data-standings-view]').forEach(b=>b.onclick=()=>{standingsView=b.dataset.standingsView;renderStandings()})}
async function standings(){S.tab='standings';$('daynav').classList.add('hidden');$('search').classList.add('hidden');$('sort').classList.add('hidden');$('status').textContent='Načítám aktuální tabulky NHL…';$('content').innerHTML='<div class="empty">Načítám tabulky NHL…</div>';try{const r=await fetch(standingsProxy,{headers:{apikey:'sb_publishable_SfeHMIvUkYTuD3jCrWub8w_fPIY0B-G'}});if(!r.ok)throw Error('NHL feed HTTP '+r.status);const data=await r.json();if(S.tab!=='standings')return;standingsRows=Array.isArray(data.standings)?data.standings:[];if(!standingsRows.length)throw Error('NHL neposkytla pořadí týmů');$('status').textContent='Aktuální tabulky NHL · '+safe(data.standingsDateTimeUtc?new Date(data.standingsDateTimeUtc).toLocaleString('cs-CZ'):'sezóna 2026/27');renderStandings()}catch(e){if(S.tab==='standings'){$('status').textContent='Tabulky se nepodařilo načíst';$('content').innerHTML='<div class="empty">'+safe(e.message)+' · Zkus obnovit data.</div>'}}}


async function dashboardSkaterLeaders(){const url='https://api.nhle.com/stats/rest/en/skater/summary';const first=await get(url,0);const total=Math.min(Number(first.total||first.totalRecords||first.data?.length||0),2000);const starts=[];for(let i=100;i<total;i+=100)starts.push(i);const chunks=await Promise.all(starts.map(start=>get(url,start)));const rows=[...(first.data||[]),...chunks.flatMap(c=>c.data||[])];const seen=new Set();return rows.filter(p=>{const key=p.playerId??p.skaterFullName;if(seen.has(key))return false;seen.add(key);return true}).sort((a,b)=>(Number(b.points)||0)-(Number(a.points)||0)||(Number(b.goals)||0)-(Number(a.goals)||0)||(Number(b.assists)||0)-(Number(a.assists)||0)).slice(0,5)}
let dashboardRequest=0;
async function dashboard(){S.tab='dashboard';const req=++dashboardRequest;$('daynav').classList.add('hidden');$('search').classList.add('hidden');$('sort').classList.add('hidden');$('status').textContent='Načítám NHL LIVE Dashboard…';$('content').innerHTML='<div class="empty">Načítám aktuální výsledky, lídry a tabulky NHL…</div>';const day=localDate(new Date());const prev=new Date(day+'T12:00:00');prev.setDate(prev.getDate()-1);const yesterday=localDate(prev);const calls=[get('https://api-web.nhle.com/v1/score/'+day),get('https://api-web.nhle.com/v1/score/'+yesterday),teamApi('standings',''),dashboardSkaterLeaders()];const result=await Promise.allSettled(calls);if(S.tab!=='dashboard'||req!==dashboardRequest)return;const [today,prior,table,leaders]=result.map(r=>r.status==='fulfilled'?r.value:null);const games=Array.isArray(today?.games)?today.games:[],oldGames=Array.isArray(prior?.games)?prior.games:[];const live=games.filter(g=>['LIVE','CRIT'].includes(g.gameState));const completed=games.filter(g=>['OFF','FINAL'].includes(g.gameState));const standings=Array.isArray(table?.standings)?table.standings:[];const skaters=Array.isArray(leaders)?leaders:[];const topTeams=[...standings].sort((a,b)=>(b.points||0)-(a.points||0)).slice(0,5);
const matchCard=g=>{const a=g.awayTeam||{},b=g.homeTeam||{},playing=['LIVE','CRIT'].includes(g.gameState),done=['OFF','FINAL'].includes(g.gameState);return '<button class="dash-game" data-game="'+safe(g.id)+'"><span class="dash-game-state '+(playing?'dash-playing':'')+'">'+safe(playing?'● ŽIVĚ':done?'KONEC':g.startTimeUTC?new Date(g.startTimeUTC).toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Prague'}):'PLÁNOVÁNO')+'</span><span class="dash-game-teams"><img src="'+safe(a.logo||teamLogo(a.abbrev||''))+'" alt=""><b>'+safe(a.abbrev||'—')+'</b><strong>'+safe(a.score??'–')+' : '+safe(b.score??'–')+'</strong><b>'+safe(b.abbrev||'—')+'</b><img src="'+safe(b.logo||teamLogo(b.abbrev||''))+'" alt=""></span></button>'};
const recent=oldGames.filter(g=>['OFF','FINAL'].includes(g.gameState)).slice(0,5);
const playerRow=(p,i)=>'<div class="dash-row"><span class="dash-position">'+(i+1)+'</span><span class="dash-player">'+safe(p.skaterFullName||p.playerName||[p.firstName,p.lastName].filter(Boolean).join(' ')||'Hráč')+' <small>'+safe(p.teamAbbrevs||p.teamAbbrev||'')+'</small></span><b>'+safe(p.points??'—')+' B</b></div>';
const teamRow=(r,i)=>{const c=tn(r.teamAbbrev);return '<button class="dash-row dash-row-button" data-team="'+safe(c)+'"><span class="dash-position">'+(i+1)+'</span><img src="'+safe(r.teamLogo||teamLogo(c))+'" alt=""><span class="dash-player">'+safe(tn(r.teamName)||c)+'</span><b>'+safe(r.points??'—')+' b</b></button>'};
$('status').textContent='NHL LIVE Dashboard · aktualizováno '+new Date().toLocaleTimeString('cs-CZ');
$('content').innerHTML='<div class="dash-heading"><div><div class="tag">NHL · ŽIVÝ PŘEHLED</div><h2>Hokej na jednom místě</h2><p>Aktuální přehled dne a sezóny</p></div><button class="btn" id="dashRefresh">↻ Aktualizovat</button></div><div class="dash-kpis"><div class="dash-kpi"><b>'+games.length+'</b><span>DNEŠNÍ ZÁPASY</span></div><div class="dash-kpi"><b class="dash-green">'+live.length+'</b><span>PRÁVĚ ŽIVĚ</span></div><div class="dash-kpi"><b>'+completed.length+'</b><span>DOHRÁNO DNES</span></div><div class="dash-kpi"><b>'+standings.length+'</b><span>TÝMŮ V TABULCE</span></div></div><div class="dash-layout"><section class="dash-panel dash-wide"><div class="dash-panel-title"><h3>⚡ Dnešní zápasy</h3><button class="dash-link" id="dashAllGames">Všechny zápasy ↗</button></div><div class="dash-game-grid">'+(games.length?games.map(matchCard).join(''):'<p>Na dnešek nejsou naplánované zápasy.</p>')+'</div></section><section class="dash-panel"><div class="dash-panel-title"><h3>🏒 Lídři produktivity</h3><button class="dash-link" id="dashAllPlayers">Statistiky ↗</button></div>'+(skaters.length?skaters.map(playerRow).join(''):'<p>Statistiky hráčů nejsou momentálně dostupné.</p>')+'</section><section class="dash-panel"><div class="dash-panel-title"><h3>🏆 Nejlepší týmy</h3><button class="dash-link" id="dashAllStandings">Tabulky ↗</button></div>'+(topTeams.length?topTeams.map(teamRow).join(''):'<p>Tabulka není momentálně dostupná.</p>')+'</section><section class="dash-panel dash-wide"><div class="dash-panel-title"><h3>🕘 Včerejší výsledky</h3></div><div class="dash-game-grid">'+(recent.length?recent.map(matchCard).join(''):'<p>Včerejší výsledky nejsou dostupné.</p>')+'</div></section></div>';
$('content').querySelectorAll('.dash-game[data-game]').forEach(b=>b.onclick=()=>detail(b.dataset.game,b));$('dashRefresh').onclick=dashboard;$('dashAllGames').onclick=()=>activate('games');$('dashAllPlayers').onclick=()=>activate('skaters');$('dashAllStandings').onclick=()=>activate('standings');
}

function activate(t){for(const [k,v] of [['tabDashboard','dashboard'],['tabGames','games'],['tabSkaters','skaters'],['tabGoalies','goalies'],['tabTeams','teams'],['tabStandings','standings']])$(k).classList.toggle('active',t===v);t==='dashboard'?dashboard():t==='games'?games():t==='teams'?teamList():t==='standings'?standings():stats(t)}
$('tabDashboard').onclick=()=>activate('dashboard');$('tabGames').onclick=()=>activate('games');$('tabSkaters').onclick=()=>activate('skaters');$('tabGoalies').onclick=()=>activate('goalies');$('tabTeams').onclick=()=>activate('teams');$('tabStandings').onclick=()=>activate('standings');$('refresh').onclick=()=>activate(S.tab);$('date').onchange=e=>{S.date=e.target.value;games()};$('search').oninput=()=>{S.expanded=false;if(S.rows.length)renderStats()};$('sort').onchange=()=>{if(S.rows.length)renderStats()};function shiftDay(n){const d=new Date(S.date+'T12:00:00');d.setDate(d.getDate()+n);S.date=localDate(d);$('date').value=S.date;games()}$('prevDay').onclick=()=>shiftDay(-1);$('nextDay').onclick=()=>shiftDay(1);$('today').onclick=()=>{S.date=localDate(new Date());$('date').value=S.date;games()};setInterval(()=>{if(S.tab==='games')games()},60000);dashboard();
</script></body></html>
