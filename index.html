/* BANGER 1.0 — HOLOGRAPHIC ARENA */
:root{--cyan:#6bf5ff;--panel:#081a32;--muted:#a3c2d6}
body{background:radial-gradient(ellipse 75% 40% at 50% -10%,#1470a0 0%,transparent 75%),radial-gradient(ellipse 70% 60% at 85% 75%,#132b62 0%,transparent 80%),#020916}
body:before{background:repeating-linear-gradient(0deg,transparent 0 39px,#45eaff0b 40px),repeating-linear-gradient(90deg,transparent 0 39px,#45eaff0b 40px);background-size:40px 40px;opacity:.55;mask-image:linear-gradient(#0009,#0002)}
.wrap:before{content:"";position:fixed;top:-350px;left:50%;width:800px;height:800px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,#19b8ff13,transparent 67%);pointer-events:none}
.top{padding:12px 0}.puck{border-radius:18px;position:relative;animation:puckGlow 4s ease-in-out infinite;box-shadow:0 0 20px #16c9ff70,inset 0 0 22px #43dfff22}
@keyframes puckGlow{50%{box-shadow:0 0 44px #16c9ffaa,inset 0 0 28px #43dfff55}}
.live{background:#041b2bb8;box-shadow:0 0 22px #14d8ff22,inset 0 0 15px #15dfff10}.dot{animation:livePulse 2s infinite}@keyframes livePulse{50%{opacity:.45;box-shadow:0 0 20px #52fca9}}
.hero{min-height:245px;display:flex;flex-direction:column;justify-content:center;isolation:isolate;background:linear-gradient(110deg,#0a2847f5 8%,#0a2942e8 65%,#061e37ee);border-color:#55dfff88;box-shadow:0 15px 55px #0008,inset 0 0 32px #22bfff15}
.hero:after{display:none}.hero h2{max-width:570px;position:relative;z-index:2;text-shadow:0 0 25px #26dfff55}.hero p,.hero .tag{position:relative;z-index:2}
.rink-scene{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;opacity:.9}
.rink-glow{position:absolute;right:-8%;top:-35%;width:70%;height:170%;background:radial-gradient(ellipse,#37dfff2c,transparent 60%);filter:blur(15px)}
.rink{position:absolute;right:-10%;top:-36%;width:70%;height:160%;border:3px solid #7bfaff88;border-radius:46%;transform:perspective(540px) rotateX(59deg) rotateZ(-24deg);box-shadow:0 0 0 14px #1dd9ff0c,0 0 40px #2eeaff70,inset 0 0 35px #30dfff44;background:linear-gradient(90deg,transparent 32%,#ff547b70 32.3%,transparent 32.8%,transparent 66%,#ff547b70 66.3%,transparent 66.8%),linear-gradient(0deg,transparent 49.7%,#ff547b55 50%,transparent 50.3%),radial-gradient(ellipse,#1bc3ff16,#0a3e6088)}
.rink:before{content:"";position:absolute;left:50%;top:50%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #e8517990;border-radius:50%;box-shadow:0 0 20px #f9557770}
.rink:after{content:"";position:absolute;inset:8%;border:1px dashed #78dfff44;border-radius:46%}
.scanbeam{position:absolute;inset:-30% -40%;background:linear-gradient(105deg,transparent 43%,#a6f9ff0b 49%,#8ffaff25 50%,transparent 54%);animation:arenaScan 10s linear infinite}@keyframes arenaScan{from{transform:translateX(-70%)}to{transform:translateX(70%)}}
.btn,.date,.search,.sort{transition:background .2s,border-color .2s,box-shadow .2s,transform .2s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0)}
.game,.metric,.tablewrap,.profilecard,.arenacard{position:relative;box-shadow:0 16px 45px #0007,inset 0 1px #d9ffff16;backdrop-filter:blur(8px)}
.game{overflow:hidden;transition:transform .22s,border-color .22s,box-shadow .22s;background:linear-gradient(145deg,#0d3453ef,#07162df5)}.game:before{content:"";position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,#65f5ff9c,transparent)}.game:hover{transform:translateY(-4px);border-color:#60eaff;box-shadow:0 18px 40px #000a,0 0 25px #18dfff28}
.team img,.arenateam img{filter:drop-shadow(0 0 14px #8feaff55)}.nums,.arenanum{background:linear-gradient(180deg,#fff,#71efff);background-clip:text;-webkit-background-clip:text;color:transparent}
.metric{background:linear-gradient(160deg,#0e3552,#071c35);border-color:#357a9a}.metric b{font-size:clamp(22px,3vw,32px);text-shadow:0 0 20px #20eaff55}
.arenacard{background:linear-gradient(160deg,#0d3654f9,#041325 75%);border:1px solid #6af2ff;box-shadow:0 0 0 1px #54eaff20,0 0 75px #09cfff55}.arenascore{background:radial-gradient(ellipse at center,#1cbcff1c,transparent 72%);border-radius:14px}.arenanum{filter:drop-shadow(0 0 12px #17cfff55)}
.arenastat{position:relative}.arenastat b{color:#d7faff;font-variant-numeric:tabular-nums}.arenastat span:nth-child(2){font-size:13px}.event{transition:border-color .2s,background .2s}.event:hover{background:#0d3c5a;border-color:#b3fbff}
.periodscore,.boxscroll{box-shadow:inset 0 0 25px #13cfff0a}.periodtitle{background:linear-gradient(90deg,#1beaff12,transparent);padding-left:12px}

.top{margin-bottom:12px;padding:8px 0 14px;border-bottom:1px solid #2d789355}.brand .puck{width:48px;height:48px;font-size:27px;border-radius:13px}.brand h1{font-size:clamp(22px,4vw,33px)}.brand .tag{font-size:10px;letter-spacing:1.6px}.toolbar{margin:12px 0 16px}.wrap{padding-top:12px}@media(max-width:480px){.top{gap:8px}.brand{gap:9px}.live{font-size:10px;padding:7px 9px}}
/* 1.0.2 – LIVE MATCH CARDS */
.game{border-radius:19px;padding:18px 17px 16px;isolation:isolate}
.game:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse 75% 50% at 50% 60%,#22c9ff12,transparent 80%)}
.gamehead{gap:8px;min-height:26px}.game-league{color:#8daec6;font-size:10px;letter-spacing:1.3px}.game-state{padding:6px 10px;border:1px solid #396a85;border-radius:30px;color:#a7c7d8;background:#061b30;font-size:11px}
.game-stage{text-align:center;color:#8eafc8;letter-spacing:2px;font-size:10px;font-weight:800;margin:13px 0 -6px}
.game .score{margin:17px 0 21px;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:7px}
.game .team{font-size:20px;letter-spacing:1px}.game .team img{width:76px;height:76px;margin-bottom:9px;transition:transform .25s,filter .25s}.game:hover .team img{transform:scale(1.07);filter:drop-shadow(0 0 17px #81eaff8c)}
.game .nums{font-size:clamp(26px,3vw,37px);letter-spacing:-1px;filter:drop-shadow(0 0 8px #4ddfff30)}.game .vs{font-size:17px;color:#598eaa}
.game .btn[data-game]{border-radius:11px;border-color:#328ba9;background:linear-gradient(110deg,#0c3a5c,#104e6d);letter-spacing:.7px;font-size:12px;box-shadow:inset 0 1px #b6faff2b}
.game-live{border-color:#29e5ae;box-shadow:0 0 0 1px #2de7b71c,0 0 26px #0ae3b11c,inset 0 1px #b5fff53c}
.game-live:before{background:linear-gradient(90deg,transparent,#36ffc9,transparent)}
.game-live .game-state{color:#72ffcf;border-color:#29dba3;background:#0b473c6e;animation:livePulse 2s infinite}
.game-live .game-stage{color:#78ffcc}.game-live .nums{filter:drop-shadow(0 0 12px #22ffb54d)}
.game-final .game-state{color:#b1c4d3;background:#122b3d}.game-upcoming .game-state{color:#80dfff;border-color:#2b83ae}
@media(max-width:420px){.game .team img{width:64px;height:64px}.game .nums{font-size:29px}.game .score{gap:3px}}

/* BANGER NHL LIVE v87 — arena interface polish */
:root{--arena-blue:#62e8ff;--arena-red:#ff4d71;--arena-line:#4fcaff55}
body{background:radial-gradient(ellipse 70% 40% at 48% -5%,#175f99 0%,transparent 75%),radial-gradient(ellipse 60% 50% at 100% 55%,#17325b 0%,transparent 75%),#030916}
.wrap{max-width:1370px}
.top{position:relative;padding:17px 20px;border:1px solid #51d9ff38;border-radius:22px;background:linear-gradient(115deg,#09294edc,#071326d9 60%,#172343ba);box-shadow:inset 0 1px #b3f7ff36,0 14px 35px #0005;overflow:hidden}
.top:after{content:"";position:absolute;right:-100px;top:-160px;width:360px;height:360px;border:1px solid #57dfff25;border-radius:50%;box-shadow:0 0 0 35px #5ddfff08,0 0 0 85px #5ddfff06;pointer-events:none}
.brand,.live{position:relative;z-index:1}
.brand h1{font-style:italic;letter-spacing:1.5px;line-height:1.1;text-shadow:0 0 22px #49caff88}
.puck{flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 35% 25%,#29658d,#071021 70%);border:3px solid #8eeeff;box-shadow:0 0 0 4px #173954,0 0 24px #38cfff77;transform:rotate(-12deg)}
.live{background:#09243d9e;backdrop-filter:blur(8px)}
.toolbar{position:sticky;top:0;z-index:25;gap:7px;padding:11px 8px;margin:15px -8px 12px;border-radius:15px;background:#06142be8;backdrop-filter:blur(18px);border:1px solid #5beaff25;box-shadow:0 12px 26px #0006}
.toolbar>.btn{font-size:12px;letter-spacing:.25px;padding:11px 12px}
.toolbar>.btn.active{background:linear-gradient(130deg,#135b89,#0b3458);box-shadow:inset 0 1px #b8f6ff5e,0 0 15px #3bdeff35}
.btn,.game,.metric,.dash-game,.dash-kpi,.dash-row,.profilecard,.arenacard{transition:border-color .2s ease,box-shadow .2s ease,background-color .2s ease,transform .2s ease}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #b6f5ff;outline-offset:3px}
.game,.metric,.dash-game,.dash-kpi{background-image:linear-gradient(150deg,#11375aeb,#08182de8);border-color:#4c9db56b;box-shadow:inset 0 1px #d1f9ff20,0 12px 24px #0004}
.game:hover,.dash-game:hover{border-color:#70e9ff;box-shadow:0 0 20px #31cfff22,0 14px 30px #0007;transform:translateY(-2px)}
.dash-heading,.hero{position:relative;overflow:hidden}
.dash-heading:before,.hero:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,transparent 20%,#6aeaff0a 50%,transparent 72%)}
.dash-heading h2{letter-spacing:.3px;text-shadow:0 0 22px #45ceff44}
.dash-kpi b,.metric b,.nums,.arenanum{font-variant-numeric:tabular-nums}
.arenacard,.profilecard{box-shadow:0 0 0 1px #6aeaff1c,0 22px 85px #000c,0 0 65px #13aaff20}
.arena-tabs{position:sticky;top:-22px;z-index:3;background:#09223ae8;padding:10px 0;backdrop-filter:blur(12px)}
@media(max-width:760px){
 .wrap{padding:10px 10px 65px}
 .top{padding:14px 12px;border-radius:16px;gap:8px}
 .brand{gap:10px}
 .puck{width:47px;height:47px;font-size:25px}
 .brand h1{font-size:clamp(21px,5.7vw,31px);letter-spacing:.2px}

 .toolbar>.btn{flex:0 0 auto;white-space:nowrap;scroll-snap-align:start;padding:11px 13px}
 .toolbar .daynav{flex:0 0 auto}

 .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}

 .arenacard,.profilecard{padding:15px;border-radius:16px;max-height:95dvh}
 .arena,.profile{padding:6px}
}
@media(prefers-reduced-motion:reduce){.btn,.game,.metric,.dash-game,.dash-kpi,.dash-row,.profilecard,.arenacard{transition:none!important}.game:hover,.dash-game:hover{transform:none}}


/* v88 arena dashboard */
.dash-arena{position:relative;overflow:hidden;margin:14px 0 18px;padding:20px;border:1px solid #55dbff80;border-radius:22px;background:radial-gradient(ellipse at 50% 120%,#2677a655,transparent 70%),linear-gradient(125deg,#0b3055,#07152e 65%,#1a244b);box-shadow:inset 0 1px #baf8ff60,0 18px 40px #0008}

.dash-arena-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.dash-arena-state{font-size:11px;font-weight:900;border:1px solid #65eaff7a;padding:7px 11px;border-radius:30px;background:#082741cc}

.dash-arena-score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;max-width:720px;margin:16px auto;text-align:center}

.dash-arena-sub{text-align:center;font-size:12px;color:#b5d4e8;margin-bottom:15px}
.dash-arena-action{display:block;margin:0 auto;min-width:180px;border-color:#7fefff;background:linear-gradient(120deg,#176b99,#0b3c68)}
.dash-arena-empty{text-align:center;padding:27px 0 14px}.dash-arena-empty strong{display:block;font-size:clamp(20px,4vw,30px)}.dash-arena-empty p{color:#bad7e8}

<script>
const $=id=>document.getElementById(id),S={tab:'games',rows:[],expanded:false,date:localDate(new Date())};function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};$('date').value=S.date;

async function get(url,start=0){const base="https://xxwqeiuyislnoxsmjuul.supabase.co/functions/v1/nhl-feed";let kind,extra="";if(url.includes("/gamecenter/")){kind=url.includes("/boxscore")?"boxscore":"game";extra="&id="+encodeURIComponent(url.split("/gamecenter/")[1].split("/")[0])}else if(url.includes("/score/")){kind="score";extra="&date="+encodeURIComponent(url.split("/score/")[1])}else{kind=url.includes("/goalie/")?"goalies":"skaters";extra="&start="+start}const r=await fetch(base+"?kind="+kind+extra,{headers:{"apikey":"sb_publishable_SfeHMIvUkYTuD3jCrWub8w_fPIY0B-G"}});if(!r.ok)throw Error("Supabase NHL feed HTTP "+r.status);return await r.json()}

async function detail(id,b){b.textContent='Načítám LIVE centrum…';$('liveArena').classList.remove('hidden');$('arenaBody').innerHTML='<button class="btn close" id="closeArena">✕ Zavřít</button><h2>Načítám detail NHL…</h2>';$('closeArena').onclick=closeArena;document.body.style.overflow='hidden';try{const d=await get('https://api-web.nhle.com/v1/gamecenter/'+id+'/landing');if($('liveArena').classList.contains('hidden'))return;const away=d.awayTeam||{},home=d.homeTeam||{};const ab=t=>t.abbrev||t.commonName?.default||t.name?.default||'NHL';const img=t=>t.logo?'<img src="'+safe(t.logo)+'" alt="">':'';const periods=d.summary?.scoring||[];const personName=n=>{if(typeof n==='string')return n;if(!n||typeof n!=='object')return '';return n.default||[n.firstName?.default||n.firstName,n.lastName?.default||n.lastName].filter(x=>typeof x==='string').join(' ')||''};const periodLabel=p=>p.periodDescriptor?.periodType==='OT'?'Prodloužení':p.periodDescriptor?.periodType==='SO'?'Nájezdy':(p.periodDescriptor?.number||1)+'. třetina';const events=periods.length?periods.map((p,i)=>{const goals=p.goals||[];const title=p.periodDescriptor?.periodType==='OT'?'Prodloužení':p.periodDescriptor?.periodType==='SO'?'Nájezdy':(p.periodDescriptor?.number||i+1)+'. třetina';return '<section class="periodgoals"><h4 class="periodtitle">'+safe(title)+' <span>'+goals.length+' gólů</span></h4>'+(goals.length?goals.map(g=>{const scorer=personName(g.name)||[personName(g.firstName),personName(g.lastName)].filter(Boolean).join(' ')||'Střelec';const assists=(g.assists||[]).map(x=>personName(x.name)||[personName(x.firstName),personName(x.lastName)].filter(Boolean).join(' ')).filter(Boolean);return '<div class="event goal-event"><span class="event-marker" aria-hidden="true">●</span><small>'+safe(g.timeInPeriod||'—')+' · '+safe(personName(g.teamAbbrev)||g.teamAbbrev||'')+'</small><div>🥅 <b>'+safe(scorer)+'</b> '+safe(g.awayScore??'')+' : '+safe(g.homeScore??'')+'</div><small>Asistence: '+safe(assists.join(', ')||'b function advOpenSection(){const s=ADV_SECTIONS.find(x=>x.id===advSection);if(s.id==='xg'){advOpenXg();return;}advEntity=s.entity;advMetric=advMetric||s.metrics[0][0];advReport=advMetricReport(advMetric,s);advQuery='';const panel=$('advPanel');if(!panel)return;panel.innerHTML='<div class="adv-panel-head"><div><h3>'+s.icon+' '+s.name+'</h3><p>'+s.desc+'</p></div><button class="btn" id="advAllReports">Všechny statistiky ⚙</button></div><div class="adv-metric-tabs">'+s.metrics.map(([key,label])=>'<button class="btn '+(advMetric===key?'active':'')+'" data-adv-metric="'+key+'">'+label+'</button>').join('')+'</div><p id="advExplain" class="adv-explain"></p><div class="adv-filters"><label>Najít hráče nebo tým<input id="advSearch" placeholder="Hledat podle jména…"></label></div><div id="advResults"></div><div id="advFullControls" class="hidden"><div class="adv-filters"><label>Hráči / brankáři / týmy<select id="advEntity"><option value="skater">Hráči</option><option value="goalie">Brankáři</option><option value="team">Týmy</option></select></label><label>Všechny dostupné přehledy<select id="advReport"></select></label></div></div>';panel.querySelectorAll('[data-adv-metric]').forEach(b=>b.onclick=()=>{advMetric=b.dataset.advMetric;advDetails=false;const nextReport=advMetricReport(advMetric,s);if(advReport!==nextReport){advReport=nextReport;$('advReport').value=advReport;loadAdvanced()}panel.querySelectorAll('[data-adv-metric]').forEach(x=>x.classList.toggle('active',x===b));renderAdvanced()});$('advSearch').oninput=e=>{advQuery=e.target.value;renderAdvanced()};$('advAllReports').onclick=()=>{advDetails=!advDetails;$('advFullControls').classList.toggle('hidden',!advDetails);renderAdvanced()};const e=$('advEntity'),r=$('advReport');e.value=advEntity;function options(){r.innerHTML=ADV_REPORTS[advEntity].map(([v,n])=>'<option value="'+v+'">'+safe(n)+'</option>').join('');r.value=advReport}options();e.onchange=()=>{advEntity=e.value;advReport='summary';advMetric='';options();loadAdvanced()};r.onchange=()=>{advReport=r.value;advMetric='';loadAdvanced()};loadAdvanced()}
async function loadAdvanced(){const seq=++advSeq,root=$('advResults');advRows=[];advColumns=[];root.innerHTML='<div class="empty">Načítám rozšířené statistiky…</div>';$('status').textContent='Načítám '+advReport+' · NHL 2026/27';const base='https://xxwqeiuyislnoxsmjuul.supabase.co/functions/v1/nhl-feed?kind=advanced&entity='+advEntity+'&report='+encodeURIComponent(advReport);const headers={apikey:'sb_publishable_SfeHMIvUkYTuD3jCrWub8w_fPIY0B-G'};try{async function page(start){const r=await fetch(base+'&start='+start,{headers});if(!r.ok)throw Error('NHL API HTTP '+r.status);return r.json()}const first=await page(0);let rows=first.data||[];const total=Math.min(3000,Number(first.total||first.totalRecords||rows.length));const offsets=[];for(let i=100;i<total;i+=100)offsets.push(i);for(let i=0;i<offsets.length;i+=4){const parts=await Promise.all(offsets.slice(i,i+4).map(page));rows.push(...parts.flatMap(x=>x.data||[]))}if(seq!==advSeq||S.tab!=='advanced')return;advRows=rows;const omit=new Set(['playerId','teamId','seasonId','gameTypeId','positionCode','playerBirthDate','playerDraftYear']);advColumns=[...new Set(rows.flatMap(x=>Object.keys(x)))].filter(k=>!omit.has(k)&&rows.some(x=>x[k]!==null&&x[k]!==undefined&&typeof x[k]!=='object'));const identity=['skaterFullName','goalieFullName','teamFullName','teamName','teamAbbrevs'];advColumns.sort((a,b)=>(identity.includes(b)?1:0)-(identity.includes(a)?1:0));advSort=advColumns.includes('points')?'points':advColumns.includes('gamesPlayed')?'gamesPlayed':advColumns.find(k=>typeof rows[0]?.[k]==='number')||advColumns[0];advDesc=true;$('status').textContent='Rozšířené statistiky: '+rows.length+' záznamů · '+advColumns.length+' ukazatelů';renderAdvanced()}catch(err){if(seq===advSeq&&S.tab==='advanced'){root.innerHTML='<div class="empty">Tento přehled není právě dostupný: '+safe(err.message)+' <button class="btn" id="advRetry">Zkusit znovu</button></div>';$('advRetry').onclick=loadAdvanced;$('status').textContent='Načítání selhalo'}} function renderAdvanced(){const root=$('advResults');if(!root||!advColumns.length)return;const q=advQuery.trim().toLocaleLowerCase('cs');const rows=advRows.filter(x=>!q||[x.skaterFullName,x.goalieFullName,x.teamFullName,x.teamName,x.teamAbbrevs].some(v=>String(v||'').toLocaleLowerCase('cs').includes(q)));const section=ADV_SECTIONS.find(x=>x.id===advSection);const metricDef=section.metrics.find(x=>x[0]===advMetric);const resolved=advResolveField(advMetric,advColumns);const metricAvailable=!!resolved;const metric=resolved||advMetric;const metricLabel=metricDef?metricDef[1]:advKeyLabel(metric);const explanation=$('advExplain');if(explanation)explanation.textContent=metricDef?(metricAvailable?metricDef[2]:'Tento ukazatel není v aktuálních datech NHL dostupný. Žádná jiná statistika ho nenahrazuje.'):'Vyber statistiku pro přehled.';const sorted=[...rows].sort((a,b)=>{const x=Number(a[metric]),y=Number(b[metric]);return (Number.isFinite(y)?y:-Infinity)-(Number.isFinite(x)?x:-Infinity)});const name=x=>x.skaterFullName||x.goalieFullName||x.teamFullName||x.teamName||x.teamAbbrevs||'NHL';const top=metricAvailable?sorted.filter(x=>x[metric]!==null&&x[metric]!==undefined&&Number.isFinite(Number(x[metric]))).slice(0,10):[];const podium=top.slice(0,3);const val=x=>x[metric]===undefined||x[metric]===null?'—':String(x[metric]);const max=Math.max(1,...top.map(x=>Number(x[metric])||0));root.innerHTML='<div class="adv-summary"><span>'+rows.length+' záznamů</span><span>'+advColumns.length+' dostupných ukazatelů</span><span>Sezóna '+'2026/27'+'</span></div>'+(top.length?'<div class="adv-podium">'+podium.map((x,i)=>'<div class="adv-podium-card"><small>TOP '+(i+1)+'</small><strong>'+safe(name(x))+'</strong><b>'+safe(val(x))+'</b><span>'+safe(metricLabel)+'</span></div>').join('')+'</div><div class="adv-ranking"><h3>TOP 10 · '+safe(metricLabel)+'</h3>'+top.map((x,i)=>'<div class="adv-rank-row"><span class="adv-rank-num">'+(i+1)+'.</span><div class="adv-rank-name">'+safe(name(x))+'<div class="adv-bar-track"><div style="width:'+Math.max(0,Math.min(100,(Number(x[metric])||0)/max*100))+'%"></div></div></div><b>'+safe(val(x))+'</b></div>').join('')+'</div>':'<div class="empty">'+(metricAvailable?'Pro vybraný filtr nejsou dostupné výsledky.':'Statistika „'+safe(advKeyLabel(metric))+'“ není v tomto přehledu NHL dostupná. Vyber jiný ukazatel nebo otevři všechny statistiky.')+'</div>')+'<button class="btn adv-expand" id="advToggleTable">'+(advDetails?'Skrýt podrobnou tabulku ↑':'Zobrazit podrobnou tabulku se všemi ukazateli ↓')+'</button>'+(advDetails?'<p class="adv-caption">V tabulce je '+advColumns.length+' sloupců. Posouvej do stran, záhlaví umožňuje řazení.</p><div class="tablewrap"><table class="adv-table"><thead><tr>'+advColumns.map(k=>'<th><button data-adv-sort="'+safe(k)+'">'+safe(advKeyLabel(k))+(k===advSort?(advDesc?' ↓':' ↑'):'')+'</button></th>').join('')+'</tr></thead><tbody>'+([...rows].sort((a,b)=>{const x=a[advSort],y=b[advSort],nx=Number(x),ny=Number(y),cmp=Number.isFinite(nx)&&Number.isFinite(ny)?nx-ny:String(x??'').localeCompare(String(y??''),'cs');return advDesc?-cmp:cmp})).slice(0,150).map(x=>'<tr>'+advColumns.map(k=>'<td>'+safe(x[k]??'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'');$('advToggleTable').onclick=()=>{advDetails=!advDetails;$('advFullControls').classList.toggle('hidden',!advDetails);renderAdvanced()};root.querySelectorAll('[data-adv-sort]').forEach(b=>b.onclick=()=>{const wrap=root.querySelector('.tablewrap');const previousLeft=wrap?wrap.scrollLeft:0;const previousTop=window.scrollY;const tableTop=wrap?wrap.getBoundingClientRect().top:0;advDesc=b.dataset.advSort===advSort?!advDesc:true;advSort=b.dataset.advSort;renderAdvanced();const newWrap=root.querySelector('.tablewrap');if(newWrap){newWrap.scrollLeft=previousLeft;const offset=newWrap.getBoundingClientRect().top-tableTop;window.scrollTo({top:previousTop+offset,behavior:'instant'})}})}
