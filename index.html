<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BANGER NHL LIVE</title><style>body{background:#061021;color:#d9f9ff;font-family:Arial;margin:0;padding:20px}header{padding:20px;background:#0c2742;border:1px solid #2be0f6;border-radius:14px}h1{color:#4ee9ff}button{background:#114869;color:white;border:1px solid #4ee9ff;border-radius:8px;padding:10px;cursor:pointer}.game{padding:14px;margin:10px 0;background:#10263e;border-radius:10px}small{color:#aac3d4}#status{padding:12px}</style></head><body><header><h1>🏒 BANGER NHL LIVE</h1><p>Holografické centrum výsledků NHL</p><button onclick="load()">Obnovit zápasy</button><small> Aktualizace každých 60 s</small></header><main><h2>Zápasy NHL</h2><div id="status">Načítání…</div><div id="games"></div></main><script>const api='https://proxy.cors.dev/https://api-web.nhle.com/v1/score/now';async function load(){const status=document.getElementById('status'),games=document.getElementById('games');status.textContent='Načítání živých dat…';try{const res=await fetch(api);if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();games.innerHTML='';for(const g of data.games||[]){const el=document.createElement('div');el.className='game';const title=document.createElement('h3');title.textContent=(g.awayTeam?.abbrev||'HOSTÉ')+' '+(g.awayTeam?.score??'–')+' : '+(g.homeTeam?.score??'–')+' '+(g.homeTeam?.abbrev||'DOMÁCÍ');el.append(title);const phase=document.createElement('p');phase.textContent='Stav: '+(g.gameState||'neznámý');el.append(phase);if(g.id){const b=document.createElement('button');b.textContent='Střelci a asistence';b.onclick=()=>details(g.id,el,b);el.append(b)}games.append(el)}status.textContent='Zápasy: '+(data.games?.length||0)+' • '+new Date().toLocaleTimeString('cs-CZ')}catch(e){status.textContent='Data se nepodařilo načíst: '+e.message}}async function details(id,el,b){b.disabled=true;try{const r=await fetch('https://proxy.cors.dev/https://api-web.nhle.com/v1/gamecenter/'+id+'/landing');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const box=document.createElement('div');const h=document.createElement('h4');h.textContent='Góly a asistence';box.append(h);const goals=[...(d.summary?.scoring||[])].flatMap(p=>p.goals||[]);if(!goals.length){const p=document.createElement('p');p.textContent='Zatím žádné góly nebo nejsou údaje dostupné.';box.append(p)}for(const goal of goals){const p=document.createElement('p');const a=(goal.assists||[]).map(x=>x.name?.default||x.name||'').join(', ');p.textContent=(goal.name?.default||'Střelec')+' — asistence: '+(a||'bez asistence');box.append(p)}el.append(box);b.remove()}catch(e){b.disabled=false;alert('Detail není dostupný: '+e.message)}}load();setInterval(load,60000)</script></body></html>
