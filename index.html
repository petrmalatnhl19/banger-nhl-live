<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030b1b"><title>BANGER NHL LIVE</title>
<style>
:root{color-scheme:dark;--cyan:#41eaff;--ink:#e8faff;--muted:#8ba9c5;--panel:#0b1b35}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:15px system-ui,Segoe UI,Arial;background:radial-gradient(ellipse at 50% -20%,#17558b 0%,#071a35 38%,#030914 90%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(transparent 96%,#43dcff0b 97%),linear-gradient(90deg,transparent 96%,#43dcff0b 97%);background-size:45px 45px;mask-image:linear-gradient(#0006,transparent)}
.wrap{max-width:1250px;margin:auto;padding:20px 16px 70px;position:relative}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:15px}.puck{display:grid;place-items:center;width:62px;height:62px;border:2px solid var(--cyan);border-radius:20px;background:radial-gradient(circle,#1c6a96,#0b203e);box-shadow:0 0 32px #1bcfff70;font-size:34px;transform:rotate(-7deg)}h1{font-size:clamp(25px,5vw,42px);letter-spacing:2px;margin:0;color:#f2fdff;text-shadow:0 0 24px #00d9ff9a}.tag{font-size:11px;letter-spacing:3px;color:var(--cyan);font-weight:800}.live{border:1px solid #3de5ff65;border-radius:99px;padding:9px 14px;color:var(--cyan);font-weight:800;box-shadow:inset 0 0 18px #00d9ff15}.dot{display:inline-block;background:#52fca9;border-radius:50%;width:9px;height:9px;box-shadow:0 0 10px #52fca9;margin-right:8px}
.hero{margin:28px 0 20px;padding:25px;border:1px solid #43d9ff65;border-radius:22px;background:linear-gradient(120deg,#102f54df,#07152bdf);box-shadow:0 0 40px #00c8ff14,inset 0 1px #b6f8ff55;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-100px;top:-100px;width:300px;height:300px;border:1px solid #32d6ff45;border-radius:50%;box-shadow:0 0 0 35px #00caff0a,0 0 0 75px #00caff07;pointer-events:none}.hero h2{font-size:clamp(23px,4vw,38px);margin:4px 0 7px}.hero p{color:var(--muted);margin:0;max-width:620px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}.btn,.date,.search{background:#0d2848;color:#e6fbff;border:1px solid #3285a9;border-radius:11px;padding:12px 16px;font:inherit}.btn{cursor:pointer;font-weight:750}.btn.active,.btn:hover{background:#114f74;border-color:var(--cyan);box-shadow:0 0 18px #19d6ff30}.date{max-width:170px}.search{min-width:200px;flex:1}.status{color:#9abbd2;margin:14px 0;min-height:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:15px}.game{border:1px solid #2a6889;border-radius:17px;background:linear-gradient(150deg,#102f51,#09172c);padding:18px;box-shadow:inset 0 1px #ffffff16,0 12px 35px #0005}.gamehead{display:flex;justify-content:space-between;align-items:center;color:#9bb9d0;font-size:12px;font-weight:750;letter-spacing:1px}.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:23px 0}.team{text-align:center;font-size:22px;font-weight:900}.team img{display:block;width:65px;height:65px;object-fit:contain;margin:0 auto 7px;filter:drop-shadow(0 0 8px #a1e6ff35)}.nums{font-size:32px;font-weight:900;white-space:nowrap;color:#fff;text-shadow:0 0 18px #29cfff65}.vs{color:#6d92a9;font-size:12px}.game button{width:100%}.goals{margin-top:15px;padding-top:12px;border-top:1px solid #2a6480;color:#d7efff}.goals p{line-height:1.5}.empty{padding:32px;border:1px dashed #3786a7;border-radius:16px;color:#9bbad2}.tablewrap{overflow:auto;border:1px solid #285f83;border-radius:15px;background:#081b34}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:13px 14px;text-align:left;border-bottom:1px solid #ffffff12}th{background:#103557;color:var(--cyan);position:sticky;top:0}tr:hover{background:#ffffff08}.hidden{display:none}.footer{color:#6689a6;font-size:12px;margin-top:30px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 20px}.metric{background:#0d2948;border:1px solid #2a7294;border-radius:13px;padding:13px;text-align:center}.metric b{display:block;font-size:25px;color:#5deaff}.metric span{font-size:11px;color:#9fbdd2}.daynav{display:flex;gap:7px}.daynav .btn{padding:10px 13px}.sort{background:#0d2848;color:#e6fbff;border:1px solid #3285a9;border-radius:11px;padding:12px}.toolbar label{color:#8ba9c5}@media(max-width:420px){.metrics{gap:6px}.metric{padding:9px 3px}.metric b{font-size:20px}}
</style></head><body><div class="wrap">
<header class="top"><div class="brand"><div class="puck">🏒</div><div><div class="tag">HOCKEY DATA COMMAND CENTER</div><h1>BANGER NHL <span style="color:var(--cyan)">LIVE</span></h1></div></div><div class="live"><span class="dot"></span> NHL DATA FEED</div></header>
<section class="hero"><div class="tag">SEZÓNA 2026 / 2027</div><h2>Ledová aréna. Živá data.</h2><p>Výsledky NHL, střelci, asistence a statistiky hráčů. Všechno na jednom místě.</p></section>
<nav class="toolbar"><button class="btn active" id="tabGames">⚡ ZÁPASY</button><button class="btn" id="tabSkaters">🏒 HRÁČI</button><button class="btn" id="tabGoalies">🥅 BRANKÁŘI</button><div class="daynav" id="daynav"><button class="btn" id="prevDay" aria-label="Předchozí den">‹</button><input class="date" type="date" id="date"><button class="btn" id="nextDay" aria-label="Další den">›</button><button class="btn" id="today">Dnes</button></div><select id="sort" class="sort hidden" aria-label="Řadit statistiky"><option value="points">Body ↓</option><option value="goals">Góly ↓</option><option value="assists">Asistence ↓</option><option value="shots">Střely ↓</option><option value="gamesPlayed">Zápasy ↓</option></select><input class="search hidden" id="search" placeholder="Hledat hráče nebo tým…"><button class="btn" id="refresh">↻ Obnovit</button></nav>
<div id="status" class="status" aria-live="polite">Připojuji se k NHL…</div><main id="content"></main><div class="footer">BANGER NHL LIVE · Data: NHL veřejné rozhraní · Neoficiální fanouškovská aplikace</div></div>
<script>
const $=id=>document.getElementById(id),S={tab:'games',rows:[],expanded:false,date:localDate(new Date())};function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};$('date').value=S.date;
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(url,start=0){const base="https://xxwqeiuyislnoxsmjuul.supabase.co/functions/v1/nhl-feed";let kind,extra="";if(url.includes("/gamecenter/")){kind="game";extra="&id="+encodeURIComponent(url.split("/gamecenter/")[1].split("/")[0])}else if(url.includes("/score/")){kind="score";extra="&date="+encodeURIComponent(url.split("/score/")[1])}else{kind=url.includes("/goalie/")?"goalies":"skaters";extra="&start="+start}const r=await fetch(base+"?kind="+kind+extra,{headers:{"apikey":"sb_publishable_SfeHMIvUkYTuD3jCrWub8w_fPIY0B-G"}});if(!r.ok)throw Error("Supabase NHL feed HTTP "+r.status);return await r.json()}
function state(v){return ({LIVE:'🔴 ŽIVĚ',CRIT:'🔴 ŽIVĚ',FINAL:'KONEC',OFF:'KONEC',FUT:'PLÁNOVÁNO',PRE:'PŘED ZÁPASEM'})[v]||v||'—'}
function team(t){return '<div class="team">'+(t?.logo?'<img src="'+safe(t.logo)+'" alt="">':'')+safe(t?.abbrev||'NHL')+'</div>'}
async function games(){S.tab='games';$('search').classList.add('hidden');$('daynav').classList.remove('hidden');$('sort').classList.add('hidden');$('status').textContent='Načítám zápasy '+S.date+'…';$('content').innerHTML='';try{const d=await get('https://api-web.nhle.com/v1/score/'+S.date);const arr=d.games||[];$('status').textContent=arr.length+' zápasů · aktualizováno '+new Date().toLocaleTimeString('cs-CZ');const live=arr.filter(g=>['LIVE','CRIT'].includes(g.gameState)).length,finished=arr.filter(g=>['OFF','FINAL'].includes(g.gameState)).length;const metrics='<div class="metrics"><div class="metric"><b>'+arr.length+'</b><span>ZÁPASŮ</span></div><div class="metric"><b>'+live+'</b><span>PRÁVĚ ŽIVĚ</span></div><div class="metric"><b>'+finished+'</b><span>DOHRÁNO</span></div></div>';if(!arr.length){$('content').innerHTML='<div class="empty">Pro tento den nejsou naplánované zápasy. Zkus jiné datum.</div>';return}$('content').innerHTML=metrics+'<div class="grid">'+arr.map(g=>'<article class="game"><div class="gamehead"><span>'+safe(g.gameType===2?'NHL REGULAR SEASON':'NHL')+'</span><span>'+state(g.gameState)+'</span></div><div class="score">'+team(g.awayTeam)+'<div class="nums">'+safe(g.awayTeam?.score??'–')+' <span class="vs">:</span> '+safe(g.homeTeam?.score??'–')+'</div>'+team(g.homeTeam)+'</div><button class="btn" data-game="'+g.id+'">Střelci a asistence ↓</button><div class="goals hidden" id="g'+g.id+'"></div></article>').join('')+'</div>';document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>detail(b.dataset.game,b))}catch(e){$('status').textContent='Nepodařilo se načíst NHL data';$('content').innerHTML='<div class="empty">⚠️ Připojení k NHL API selhalo: '+safe(e.message)+'. Zkus tlačítko Obnovit. Pokud chyba přetrvá, bude potřeba serverové propojení přes Supabase.</div>'}}
async function detail(id,b){const el=$('g'+id);if(!el.classList.contains('hidden')){el.classList.add('hidden');return}b.textContent='Načítám…';try{const d=await get('https://api-web.nhle.com/v1/gamecenter/'+id+'/landing');const goals=(d.summary?.scoring||[]).flatMap(p=>p.goals||[]);el.innerHTML=goals.length?goals.map(g=>'<p>🥅 <b>'+safe(g.name?.default||g.firstName?.default+' '+g.lastName?.default||'Střelec')+'</b> · asistence: '+safe((g.assists||[]).map(a=>a.name?.default||'').filter(Boolean).join(', ')||'bez asistence')+'</p>').join(''):'Zatím nejsou dostupné záznamy gólů.';el.classList.remove('hidden');b.textContent='Skrýt detail ↑'}catch(e){b.textContent='Zkusit znovu';el.textContent='Detail nelze načíst: '+e.message;el.classList.remove('hidden')}}
const season=()=>{const d=new Date(),y=d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;return ''+y+(y+1)};
async function stats(type){S.tab=type;S.expanded=false;S.rows=[];$('daynav').classList.add('hidden');$('search').classList.remove('hidden');$('sort').classList.remove('hidden');$('sort').innerHTML=type==='goalies'?'<option value="wins">Výhry ↓</option><option value="savePctg">Úspěšnost ↓</option><option value="gamesPlayed">Zápasy ↓</option><option value="goalsAgainstAverage">Průměr inkasovaných ↑</option>':'<option value="points">Body ↓</option><option value="goals">Góly ↓</option><option value="assists">Asistence ↓</option><option value="shots">Střely ↓</option><option value="gamesPlayed">Zápasy ↓</option>';$('search').value='';$('content').innerHTML='';$('status').textContent='Načítám kompletní žebříček NHL…';try{const endpoint=type==='goalies'?'goalie':'skater';const url='https://api.nhle.com/stats/rest/en/'+endpoint+'/summary';const first=await get(url,0);if(S.tab!==type)return;let rows=first.data||[];const total=Math.min(Number(first.total||first.totalRecords||rows.length),2000);const starts=[];for(let i=100;i<total;i+=100)starts.push(i);for(let i=0;i<starts.length;i+=4){const batch=await Promise.all(starts.slice(i,i+4).map(async start=>{const page=await get(url,start);return page.data||[]}));if(S.tab!==type)return;rows.push(...batch.flat());$('status').textContent='Načteno '+rows.length+' z '+total+' hráčů…'}const seen=new Set();S.rows=rows.filter(r=>{const id=r.playerId??r[endpoint+'Id']??r[endpoint+'FullName']+'|'+r.teamAbbrevs;if(seen.has(id))return false;seen.add(id);return true});renderStats();$('status').textContent='Kompletní statistiky: '+S.rows.length+' hráčů · sezóna '+season()}catch(e){$('status').textContent='Načítání statistik selhalo';$('content').innerHTML='<div class="empty">⚠️ Nepodařilo se načíst celý žebříček: '+safe(e.message)+'. Zkus Obnovit.</div>'}}
function renderStats(){const isG=S.tab==='goalies',key=$('sort').value,q=$('search').value.trim().toLocaleLowerCase('cs');const nameKey=isG?'goalieFullName':'skaterFullName';const base=[...S.rows].sort((a,b)=>{const av=Number(a[key]),bv=Number(b[key]);const primary=key==='goalsAgainstAverage'?(Number.isFinite(av)?av:999)-(Number.isFinite(bv)?bv:999):(Number.isFinite(bv)?bv:0)-(Number.isFinite(av)?av:0);if(primary!==0)return primary;const tieKeys=isG?['wins','savePctg','gamesPlayed']:['points','goals','assists','gamesPlayed'];for(const t of tieKeys){if(t===key)continue;const diff=Number(b[t]??0)-Number(a[t]??0);if(diff!==0)return diff}return String(a[nameKey]||'').localeCompare(String(b[nameKey]||''),'cs')});const ranked=base.map((r,i)=>({...r,_rank:i+1}));const filtered=ranked.filter(r=>(String(r[nameKey]||'')+' '+String(r.teamAbbrevs||'')).toLocaleLowerCase('cs').includes(q));const rows=S.expanded?filtered:filtered.slice(0,10);const cols=isG?[['goalieFullName','Brankář'],['teamAbbrevs','Tým'],['gamesPlayed','Z'],['wins','V'],['losses','P'],['savePctg','SV%'],['goalsAgainstAverage','GAA']]:[['skaterFullName','Hráč'],['teamAbbrevs','Tým'],['gamesPlayed','Z'],['goals','G'],['assists','A'],['points','B'],['shots','Střely']];const fmt=(r,k)=>{const v=r[k];if(v===null||v===undefined)return '–';if(k==='savePctg'){const n=Number(v);return Number.isFinite(n)?(n<=1?n*100:n).toLocaleString('cs-CZ',{minimumFractionDigits:1,maximumFractionDigits:2})+' %':'–'}if(k==='goalsAgainstAverage'){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2}):'–'}return String(v)};$('content').innerHTML='<div class="status">Žebříček: '+safe($('sort').selectedOptions[0]?.textContent||'')+' · '+filtered.length+' z '+base.length+' hráčů · zobrazeno '+rows.length+'</div><div class="tablewrap"><table><thead><tr><th>Poř.</th>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><td><b style="color:#41eaff">'+r._rank+'.</b></td>'+cols.map(c=>'<td>'+safe(fmt(r,c[0]))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+(filtered.length>10?'<div style="text-align:center;margin:18px"><button class="btn" id="showMore">'+(S.expanded?'Zobrazit TOP 10 ↑':'Více hráčů ('+(filtered.length-10)+') ↓')+'</button></div>':'');const more=$('showMore');if(more)more.onclick=()=>{S.expanded=!S.expanded;renderStats()}}
function activate(t){for(const [k,v] of [['tabGames','games'],['tabSkaters','skaters'],['tabGoalies','goalies']])$(k).classList.toggle('active',t===v);t==='games'?games():stats(t)}
$('tabGames').onclick=()=>activate('games');$('tabSkaters').onclick=()=>activate('skaters');$('tabGoalies').onclick=()=>activate('goalies');$('refresh').onclick=()=>activate(S.tab);$('date').onchange=e=>{S.date=e.target.value;games()};$('search').oninput=()=>{S.expanded=false;if(S.rows.length)renderStats()};$('sort').onchange=()=>{if(S.rows.length)renderStats()};function shiftDay(n){const d=new Date(S.date+'T12:00:00');d.setDate(d.getDate()+n);S.date=localDate(d);$('date').value=S.date;games()}$('prevDay').onclick=()=>shiftDay(-1);$('nextDay').onclick=()=>shiftDay(1);$('today').onclick=()=>{S.date=localDate(new Date());$('date').value=S.date;games()};setInterval(()=>{if(S.tab==='games')games()},60000);games();
</script></body></html>
