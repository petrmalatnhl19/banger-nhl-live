<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BANGER VOICE-04 – Android diagnostika</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{background:#071427;color:#e6f5ff;max-width:680px;margin:auto;padding:20px}h1{font-size:1.5rem}section{background:#102741;border:1px solid #31516b;border-radius:14px;padding:16px;margin:16px 0}button,select{background:#183f62;color:white;border:1px solid #6bc9ed;border-radius:8px;padding:12px;font:inherit}button:disabled{opacity:.5}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto;font-size:.8rem}small{color:#b5cee2}#status{font-weight:700}button+button{margin-left:8px}
</style>
</head>
<body>
<h1>BANGER VOICE-04</h1>
<p>Izolovaný test českého hlasu M2 na Androidu. Model se stáhne až po stisknutí Spustit. Experiment FP16 není ověřený a může spotřebovat stovky MB dat.</p>
<section>
<label for="variant">Varianta modelu</label>
<select id="variant"><option value="fp16">FP16 – experiment</option><option value="fp32">FP32 – původní</option></select>
<p><button id="start">Spustit test</button><button id="stop" disabled>Zastavit</button></p>
<p id="status" role="status">Připraveno</p>
<small>Testovací věta: „Dallas Stars právě vstřelili gól! Skvělá akce a nádherná střela!“</small>
</section>
<section><strong>Diagnostický protokol</strong><pre id="log" aria-live="polite"></pre><button id="copy">Kopírovat protokol</button></section>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const start=$('start'),stop=$('stop'),status=$('status'),log=$('log'),variant=$('variant');
let worker,context,source,timer,startedAt=0,requestId=0;
const say=s=>{status.textContent=s;record(s)};
const record=s=>{const t=startedAt?'+'+((performance.now()-startedAt)/1000).toFixed(1)+'s':'—';log.textContent+='['+t+'] '+s+'\n';log.scrollTop=log.scrollHeight};
const cleanup=()=>{clearTimeout(timer);timer=null;worker?.terminate();worker=null;if(source){try{source.stop()}catch{}source.disconnect();source=null}start.disabled=false;stop.disabled=true;variant.disabled=false};
start.addEventListener('click',async()=>{
cleanup();log.textContent='';startedAt=performance.now();const choice=variant.value;
start.disabled=true;stop.disabled=false;variant.disabled=true;
try {
context??=new (window.AudioContext||window.webkitAudioContext)();
await context.resume();
const url=new URL('./voice/match-voice.worker.mjs',location.href);
if(choice==='fp16')url.searchParams.set('model','fp16');
worker=new Worker(url,{type:'module'});
const id=++requestId;
worker.onerror=e=>{say('Chyba workeru: '+(e.message||'neznámá'));cleanup()};
worker.onmessage=async({data})=>{
if(data.id!=null&&data.id!==id)return;
if(data.type==='stage'){say(data.stage);return}
if(data.type==='progress'){record('Model '+data.stage+' '+data.done+'/4 – '+(data.phase||'inicializace')+(data.elapsedMs!=null?' ('+(data.elapsedMs/1000).toFixed(1)+' s)':''));return}
if(data.type==='error'){say('Chyba: '+data.message);cleanup();return}
if(data.type==='audio'){
clearTimeout(timer);timer=null;
try{
const buffer=context.createBuffer(1,data.audio.length,data.rate);
buffer.copyToChannel(data.audio,0);source=context.createBufferSource();source.buffer=buffer;source.connect(context.destination);
source.onended=()=>{say('Přehrávání dokončeno');cleanup()};
say('Zvuk vygenerován za '+((performance.now()-startedAt)/1000).toFixed(1)+' s; přehrávám');
source.start();
}catch(e){say('Chyba přehrávání: '+e.message);cleanup()}
}
};
say('Spouštím '+choice.toUpperCase()+' – čekám na worker');
worker.postMessage({type:'speak',id,text:'Dallas Stars právě vstřelili gól! Skvělá akce a nádherná střela!',speed:1});
timer=setTimeout(()=>{say('Časový limit 180 s – poslední fáze: '+status.textContent);cleanup()},180000);
}catch(e){say('Chyba spuštění: '+e.message);cleanup()}
});
stop.addEventListener('click',()=>{say('Zastaveno uživatelem');cleanup()});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText('VOICE-04 '+variant.value+'\n'+log.textContent);record('Protokol zkopírován')}catch(e){record('Kopírování selhalo: '+e.message)}});
})();
</script>
</body></html>
